<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Studio Yaniv</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='15%25' y1='10%25' x2='85%25' y2='95%25'%3E%3Cstop offset='0%25' stop-color='%23c4e4ff'/%3E%3Cstop offset='50%25' stop-color='%2368b6f3'/%3E%3Cstop offset='100%25' stop-color='%232b84db'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='112' height='112' rx='28' fill='url(%23g)'/%3E%3Cpath d='M24 53 C42 56 52 70 55 104 C62 76 75 54 92 24 C85 52 70 74 55 104 C53 78 40 62 24 53Z' fill='%230a78e6'/%3E%3Ctext x='53' y='57' text-anchor='middle' font-family='Arial' font-weight='900' font-size='42' fill='%230a78e6'%3ES%3C/text%3E%3Ccircle cx='77' cy='36' r='6' fill='%230a78e6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
  <style>
    :root{--bg:#070a12;--card:#101624;--elevated:#172034;--border:rgba(255,255,255,.1);--accent:#38bdf8;--primary:linear-gradient(135deg,#2563eb,#0ea5e9);--vid:linear-gradient(135deg,#7c3aed,#2563eb);--text:#f8fafc;--muted:#94a3b8;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Heebo',system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#0d162a 0%,var(--bg) 60%);color:var(--text);min-height:100dvh;padding-bottom:20px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(7,10,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.06rem}
    .brand-logo{width:38px;height:38px;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(56,189,248,.35))}
    .top-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .ratio-pills{display:flex;gap:2px;background:var(--card);border:1px solid var(--border);padding:3px;border-radius:999px}
    .ratio-btn{background:transparent;border:none;color:var(--muted);padding:3px 8px;border-radius:999px;font-family:inherit;font-size:.72rem;cursor:pointer}
    .ratio-btn.active{background:var(--primary);color:#fff;font-weight:700}
    .top-pill-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:999px;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
    .top-pill-btn.dl-pill{background:#fff;color:#09090b;border-color:#fff}
    .studio-wrap{width:100%;max-width:860px;margin:10px auto 0;padding:0 12px;display:flex;flex-direction:column;gap:10px}
    .mask-bar{display:none;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:6px 10px;border-radius:12px;flex-wrap:wrap}
    .mask-bar.visible{display:flex}
    .tool-chip{background:var(--elevated);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:999px;font-family:inherit;font-size:.75rem;cursor:pointer}
    .tool-chip.active{background:#fff;color:#09090b;font-weight:700}
    .viewport{position:relative;width:100%;background:#03050a;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;max-height:48dvh;margin:0 auto;user-select:none}
    .viewport.ratio-9-16{aspect-ratio:9/16;max-width:270px;max-height:52dvh}
    .viewport.ratio-1-1{aspect-ratio:1/1;max-width:360px;max-height:48dvh}
    #mainVideo,#mainImage{width:100%;height:100%;object-fit:contain;display:none}
    #maskCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;display:none;z-index:12;touch-action:none}
    .empty-icon{width:54px;height:54px;border-radius:50%;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.35);display:flex;align-items:center;justify-content:center;color:#38bdf8}
    .center-play{position:absolute;z-index:15;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;cursor:pointer}
    .center-play.visible{display:flex}
    .center-play svg{fill:#fff;margin-left:3px}
    .timeline-overlay{position:absolute;bottom:0;left:0;right:0;padding:18px 10px 7px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);z-index:20;display:none;transition:opacity .25s}
    .timeline-overlay.active{display:block}
    .timeline-overlay.auto-hidden{opacity:0;pointer-events:none}
    .scrubber-row{display:flex;align-items:center;gap:8px;direction:ltr}
    #timelineSlider{flex:1;accent-color:var(--accent);cursor:pointer;height:4px}
    .time-badge{font-size:.72rem;color:#e2e8f0;font-variant-numeric:tabular-nums;min-width:88px;text-align:center}
    .render-overlay,.quota-overlay{position:absolute;inset:0;background:rgba(5,7,12,.92);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:30;padding:16px;text-align:center}
    .render-overlay.active,.quota-overlay.active{display:flex}
    .quota-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
    .q-btn{background:var(--elevated);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:10px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:none}
    .q-btn.primary{background:var(--primary);border:none;color:#fff}
    .progress-ring-wrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
    .progress-ring-wrap svg{transform:rotate(-90deg)}
    .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6}
    .ring-fill{fill:none;stroke:#38bdf8;stroke-width:6;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201}
    .progress-pct{position:absolute;font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
    .progress-bar-track{width:min(210px,76%);height:4px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
    .progress-bar-fill{height:100%;width:1%;background:var(--primary)}
    .playback-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:6px 8px;gap:6px;flex-wrap:wrap}
    .transport{display:flex;align-items:center;gap:5px;direction:ltr}
    .ctrl-btn{background:var(--elevated);border:1px solid var(--border);color:var(--text);width:38px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem}
    .ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
    .ctrl-btn.play-main{background:var(--primary);border-color:transparent}
    .eraser-controls{display:flex;align-items:center;gap:5px}
    .btn-eraser{background:var(--elevated);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:9px;font-family:inherit;font-size:.77rem;font-weight:600;cursor:pointer}
    .btn-eraser.active{background:#fff;color:#09090b}
    .btn-eraser.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.38);color:#fca5a5}
    .btn-eraser:disabled{opacity:.32;cursor:not-allowed}
    .prompt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px;display:flex;flex-direction:column;gap:9px}
    .text-input-row{position:relative;display:flex;align-items:flex-start;background:#06080f;border:1px solid var(--border);border-radius:12px;padding:4px 4px 4px 40px}
    #promptInput{flex:1;background:transparent;border:none;color:var(--text);padding:8px 10px;font-family:inherit;font-size:.94rem;resize:none;min-height:52px;outline:none}
    .clear-text-btn{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:var(--elevated);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem}
    .clear-text-btn:hover{color:#fca5a5;border-color:rgba(239,68,68,.45)}
    .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .act-btn{border:1px solid var(--border);border-radius:11px;padding:11px 8px;font-family:inherit;font-size:.87rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .act-btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-vid{background:var(--vid);color:#fff;border:none}
    .btn-img{background:var(--primary);color:#fff;border:none}
    .btn-ext{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.35)}
    .btn-surp{background:var(--elevated);color:var(--text)}
    .upload-suite{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .upload-wrap{position:relative}
    .upload-btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:12px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
    .dropdown-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--elevated);border:1px solid var(--accent);border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.85);display:none;flex-direction:column;overflow:hidden;z-index:35}
    .dropdown-menu.open{display:flex}
    .dropdown-item{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.06);color:var(--text);padding:11px 13px;font-family:inherit;font-size:.86rem;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:right}
    .dropdown-item:hover{background:rgba(56,189,248,.2)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;padding:16px;max-height:88dvh;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
    .modal h2{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
    .close-pill{background:var(--elevated);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:999px;font-family:inherit;font-size:.78rem;cursor:pointer}
    .dl-list{display:flex;flex-direction:column;gap:10px}
    .dl-card{background:#080b12;border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
    .dl-media-box{width:100%;max-height:240px;background:#000;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .dl-media-box video,.dl-media-box img{width:100%;max-height:240px;object-fit:contain}
    .dl-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .dl-btn{border-radius:9px;padding:9px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;border:1px solid var(--border)}
    .dl-btn-save{background:#fff;color:#09090b;border-color:#fff}
    .dl-btn-del{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.4)}
    .provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .field-group{display:flex;flex-direction:column;gap:3px}
    .field-group label{font-size:.73rem;color:var(--muted)}
    .field-group input{background:#06080e;border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:8px;font-size:.78rem;direction:ltr}
    .field-group input:focus{border-color:var(--accent);outline:none}
    #cameraPreview{width:100%;border-radius:10px;background:#000;max-height:260px}
    @media (max-width:600px){.provider-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Studio Yaniv Logo">
        <defs>
          <linearGradient id="skySquircle" x1="15%" y1="10%" x2="85%" y2="95%"><stop offset="0%" stop-color="#c4e4ff"/><stop offset="50%" stop-color="#68b6f3"/><stop offset="100%" stop-color="#2b84db"/></linearGradient>
          <linearGradient id="metalAzure" x1="10%" y1="0%" x2="90%" y2="100%"><stop offset="0%" stop-color="#7ecaff"/><stop offset="45%" stop-color="#0a78e6"/><stop offset="100%" stop-color="#05419c"/></linearGradient>
        </defs>
        <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#skySquircle)" stroke="#1b6bc2" stroke-width="2.5"/>
        <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4"/>
        <path d="M24 53 C42 56,52 70,55 104 C62 76,75 54,92 24 C85 52,70 74,55 104 C53 78,40 62,24 53 Z" fill="url(#metalAzure)" stroke="#cbeaff" stroke-width="1.2" stroke-linejoin="round"/>
        <text x="53" y="57" text-anchor="middle" font-family="Heebo,Arial,sans-serif" font-weight="900" font-size="42" fill="url(#metalAzure)" stroke="#dff2ff" stroke-width="1.3">S</text>
        <circle cx="77" cy="36" r="6" fill="url(#metalAzure)" stroke="#dff2ff" stroke-width="1.1"/>
      </svg>
      <span>Studio Yaniv</span>
    </div>
    <div class="top-controls">
      <div class="ratio-pills">
        <button class="ratio-btn active" data-ratio="16:9">16:9</button>
        <button class="ratio-btn" data-ratio="9:16">9:16</button>
        <button class="ratio-btn" data-ratio="1:1">1:1</button>
      </div>
      <button class="top-pill-btn dl-pill" id="openDownloadsBtn">⬇ (<span id="vaultCount">0</span>)</button>
      <button class="top-pill-btn" id="openSettingsBtn" title="הגדרות">⚙</button>
    </div>
  </header>

  <main class="studio-wrap">
    <div class="mask-bar" id="maskBar">
      <button class="tool-chip active" id="toolBrushBtn">🖌 סמן</button>
      <button class="tool-chip" id="toolEraserBtn">🧽 מחק מסכה</button>
      <input type="range" id="brushSize" min="8" max="64" value="28" style="width:64px;">
      <button class="tool-chip" id="clearMaskBtn">נקה</button>
    </div>

    <section class="viewport" id="viewportWrapper">
      <div class="empty-icon" id="emptyStage"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg></div>
      <video id="mainVideo" playsinline></video>
      <img id="mainImage" alt="" />
      <canvas id="maskCanvas"></canvas>
      <button class="center-play" id="centerPlayBtn" aria-label="נגן"><svg width="22" height="22" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
      <div class="timeline-overlay" id="timelineOverlay">
        <div class="scrubber-row"><span class="time-badge" id="timeDisplay">00:00 / 00:00</span><input type="range" id="timelineSlider" min="0" max="100" step="0.01" value="0" /></div>
      </div>
      <div class="render-overlay" id="renderOverlay">
        <div class="progress-ring-wrap">
          <svg width="76" height="76" viewBox="0 0 76 76"><circle class="ring-bg" cx="38" cy="38" r="32"></circle><circle class="ring-fill" id="ringFill" cx="38" cy="38" r="32"></circle></svg>
          <span class="progress-pct" id="progressPct">1%</span>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBarFill"></div></div>
        <div id="renderSub" style="font-size:.76rem;color:var(--muted);"></div>
      </div>
      <div class="quota-overlay" id="quotaOverlay">
        <div id="quotaMsg" style="font-size:.88rem;line-height:1.5;max-width:380px;"></div>
        <div class="quota-actions">
          <button class="q-btn primary" id="qMakeImgBtn">🎨 צור תמונה במקום</button>
          <button class="q-btn" id="qOpenSetBtn">⚙ הוסף מפתח חינמי מתחדש</button>
          <a class="q-btn" href="https://create.wan.video" target="_blank" rel="noopener">🎬 Wan חינם</a>
          <a class="q-btn" href="https://klingai.com" target="_blank" rel="noopener">🎬 Kling חינם</a>
          <a class="q-btn" href="https://hailuoai.video" target="_blank" rel="noopener">🎬 Hailuo חינם</a>
          <button class="q-btn" id="qCloseBtn">✕ סגור</button>
        </div>
      </div>
    </section>

    <section class="playback-bar">
      <div class="transport">
        <button class="ctrl-btn" id="btnSkipBack" disabled>⏮</button>
        <button class="ctrl-btn play-main" id="btnPlay" disabled>▶</button>
        <button class="ctrl-btn" id="btnPause" disabled>⏸</button>
        <button class="ctrl-btn" id="btnStop" disabled>■</button>
        <button class="ctrl-btn" id="btnSkipFwd" disabled>⏭</button>
      </div>
      <div class="eraser-controls">
        <button class="btn-eraser" id="toggleMaskBtn" disabled>🖌 מסכה</button>
        <button class="btn-eraser" id="btnUndoSegment" disabled>↩ מקטע</button>
        <button class="btn-eraser danger" id="btnClearMediaBelow" disabled>🧽 מחק</button>
      </div>
    </section>

    <section class="prompt-card">
      <div class="text-input-row">
        <textarea id="promptInput" rows="2" placeholder="כתוב תיאור, שינוי על תמונה, או טקסט לדיבור / מוזיקה..."></textarea>
        <button class="clear-text-btn" id="btnClearPrompt" title="מחק טקסט">✕</button>
      </div>
      <div class="quick-actions">
        <button class="act-btn btn-vid" id="btnCreateVideo">🎬 יצירת וידאו</button>
        <button class="act-btn btn-img" id="btnCreateImage">🎨 יצירת תמונה</button>
        <button class="act-btn btn-ext" id="btnExtend">⏩ הארך +6s</button>
        <button class="act-btn btn-surp" id="btnSurprise">🎲 הפתע</button>
      </div>
    </section>

    <section class="upload-suite">
      <div class="upload-wrap">
        <button class="upload-btn" id="btnUploadVideoMenu">🎥 העלאת סרטון ▾</button>
        <div class="dropdown-menu" id="videoDropdown">
          <button class="dropdown-item" id="optVideoGallery">📁 גלריה</button>
          <button class="dropdown-item" id="optVideoCamera">📷 מצלמה</button>
        </div>
        <input type="file" id="inputVideoGallery" accept="video/*,.mp4,.mov,.webm,.3gp,.mkv" hidden />
        <input type="file" id="inputVideoCameraNative" accept="video/*" capture="environment" hidden />
      </div>
      <div class="upload-wrap">
        <button class="upload-btn" id="btnUploadImageMenu">🖼 העלאת תמונה ▾</button>
        <div class="dropdown-menu" id="imageDropdown">
          <button class="dropdown-item" id="optImageGallery">📁 גלריה</button>
          <button class="dropdown-item" id="optImageCamera">📷 מצלמה</button>
        </div>
        <input type="file" id="inputImageGallery" accept="image/*,.heic,.heif,.png,.jpg,.jpeg,.webp,.bmp" hidden />
        <input type="file" id="inputImageCameraNative" accept="image/*" capture="environment" hidden />
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="downloadsModal">
    <div class="modal">
      <h2><span>📁 תיקיית הורדות</span><button class="close-pill" id="closeDownloadsBtn">✕</button></h2>
      <div id="downloadsList" class="dl-list"></div>
    </div>
  </div>

  <!-- Only 100% Free & Renewing Servers -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2><span>⚙ שרתים חינמיים מתחדשים</span><button class="close-pill" id="closeSettingsBtn">✕</button></h2>
      <div id="localFileWarn" style="display:none;font-size:.76rem;color:#fcd34d;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);padding:7px 10px;border-radius:9px;">
        ⚠ הקובץ רץ מקומית (content:// / file://). לחיבור יציב ללא חסימות מומלץ לפתוח מכתובת https.
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px;">
        <button class="act-btn btn-surp" id="puterConnectBtn" style="padding:8px;">⚡ <span id="puterStatusTxt">חיבור חשבון חינמי</span></button>
        <button class="act-btn btn-ext" id="resetCooldownsBtn" style="padding:8px 12px;">↻ רענן</button>
      </div>
      <div class="provider-grid">
        <div class="field-group"><label>LLM7.io (חינמי • 250/שעה • וידאו ותמונות)</label><input data-sync-key="1" type="password" id="keyLLM7" placeholder="הדבק מפתח למילוי כולן..." /></div>
        <div class="field-group"><label>Api.Airforce (1,000/יום מתחדש)</label><input data-sync-key="1" type="password" id="keyAirforce" placeholder="הדבק מפתח למילוי כולן..." /></div>
        <div class="field-group"><label>Hugging Face (ZeroGPU מתחדש יומי)</label><input data-sync-key="1" type="password" id="keyHF" placeholder="הדבק מפתח למילוי כולן..." /></div>

      const t = await callMultiLLM(`${rule} Output ONLY the English text: "${clean}"`);

    } catch {}
    let tr = null;
    try { const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=he|en`); if (r.ok) { const c = (await r.json())?.responseData?.translatedText?.trim(); if (c && !/MYMEMORY|LIMIT/i.test(c) && !/[\u0590-\u05FF]/.test(c)) tr = c; } } catch {}

    if (img.naturalWidth === tw && img.naturalHeight === th) return url;
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    const sc = Math.min(tw/img.naturalWidth, th/img.naturalHeight), dw = img.naturalWidth*sc, dh = img.naturalHeight*sc;
    c.getContext('2d').drawImage(img, (tw-dw)/2, (th-dh)/2, dw, dh);
    return c.toDataURL('image/png');
  }
  async function compositeMask(origUrl, editUrl, maskC) {

    const w = oImg.naturalWidth, h = oImg.naturalHeight, out = document.createElement('canvas'); out.width = w; out.height = h;
    const ctx = out.getContext('2d'); ctx.drawImage(oImg,0,0,w,h);
    const m = document.createElement('canvas'); m.width = w; m.height = h; const mctx = m.getContext('2d');
    mctx.drawImage(maskC,0,0,w,h); const md = mctx.getImageData(0,0,w,h);
    for (let i=0;i<md.data.length;i+=4) md.data[i+3] = md.data[i]>128 ? 255 : 0;
    mctx.putImageData(md,0,0);
    const cut = document.createElement('canvas'); cut.width = w; cut.height = h; const cctx = cut.getContext('2d');
    cctx.filter = 'blur(4px)'; cctx.drawImage(m,0,0); cctx.filter = 'none'; cctx.globalCompositeOperation = 'source-in';
    const sc = Math.min(w/eImg.naturalWidth, h/eImg.naturalHeight), dw = eImg.naturalWidth*sc, dh = eImg.naturalHeight*sc;
    cctx.drawImage(eImg, (w-dw)/2, (h-dh)/2, dw, dh); ctx.drawImage(cut,0,0);
    return out.toDataURL('image/png');
  }

  async function genMin6Sec(en, frameUrl = null, audioFlags = null) {
    let speechBlob = null, musicBlob = null;
    if (audioFlags?.hasSpeech) speechBlob = await generateSpeechAudio(audioFlags.spokenText);
    if (audioFlags?.hasMusic && !audioFlags?.hasSpeech) musicBlob = await generateMusicAudio(en);

    if (frameUrl && speechBlob) {
      const lipSeg = await routeLipSyncVideo(en, frameUrl, speechBlob);
      if (lipSeg) {
        if ((lipSeg.duration || 0) >= 6) return lipSeg;
        const lf = await capLastSegFrame(lipSeg.url);
        try {
          const cont = await requestVideoHop(`${en}. Seamless direct continuation keeping exact same faces and background.`, lf);
          const mb = await mergeSegs([lipSeg, cont]), mu = URL.createObjectURL(mb);
          return { url:mu, blob:mb, duration:await probeDur(mu) };
        } catch { return lipSeg; }
      }
    }

    const col = []; let tot = 0, cur = frameUrl;
    for (let h = 0; h < 2 && tot < 6; h++) {
      const p = h === 0 ? en : `${en}. Seamless direct continuation from final frame, keeping exact same people, faces, clothing, lighting, and background unchanged.`;
      if (h > 0) setRenderProgress(88, 'משלים אורך וידאו (לפחות 6 שניות)...');
      try {
        const seg = await requestVideoHop(p, cur);
        col.push(seg); tot += seg.duration || 5;
        if (tot < 6) cur = await capLastSegFrame(seg.url);
      } catch (err) { if (h === 0) throw err; break; }
    }
    if (!col.length) { const e = new Error('מכסת הווידאו החינמית התמלאה כרגע.'); e.isQuota = true; throw e; }
    let finalSeg = col.length === 1 ? col[0] : null;
    if (!finalSeg) {
      setRenderProgress(93, 'מאחד לרצף חלק...');
      const mb = await mergeSegs(col), mu = URL.createObjectURL(mb);
      finalSeg = { url:mu, blob:mb, duration:await probeDur(mu) };
    }
    const attachAudio = speechBlob || musicBlob;
    if (attachAudio) {
      setRenderProgress(96, 'מצמיד קול / מוזיקה לווידאו...');
      try { return await muxAudioIntoVideo(finalSeg.url, attachAudio); } catch {}
    }
    return finalSeg;
  }

  async function capLastSegFrame(url) {
    const v = document.createElement('video'); v.crossOrigin = 'anonymous'; v.src = url;
    await new Promise(r => { v.onloadedmetadata = r; });
    v.currentTime = Math.max(0, (v.duration || 1) - .05);
    await new Promise(r => { v.onseeked = r; });
    const c = document.createElement('canvas'); c.width = v.videoWidth || 1024; c.height = v.videoHeight || 576;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    return c.toDataURL('image/png');
  }
  const capLastStageFrame = async () => state.mediaType === 'image' ? state.currentImageSrc : (state.mediaType === 'video' && state.videoSegments.length ? await capLastSegFrame(state.videoSegments[state.videoSegments.length - 1].url) : null);

    try {
      const audioFlags = detectAudioFlags(raw);
      const baseFrame = state.mediaType === 'image' ? state.currentImageSrc : (state.mediaType === 'video' ? await capLastStageFrame() : null);
      const en = await translateStrict(raw || 'natural cinematic motion keeping exact faces and background', baseFrame ? 'img2vid' : 'txt2vid');
      const seg = await genMin6Sec(en, baseFrame, audioFlags);
      await finishRenderProgress(true);
      await showVideoStage([seg], true, true);
    } catch (e) {
      await finishRenderProgress(false);
      if (e.isQuota) showQuotaNotice(e.message);

      const locked = `${en}. Seamless continuation from the exact last frame: strictly preserve the exact same people, faces, clothing, lighting, and background without altering them.`;
      const ext = await genMin6Sec(locked, lf, audioFlags);
      const list = state.mediaType === 'video' ? [...state.videoSegments, ext] : [ext];

  function saveToVault(item) { state.vaultItems.unshift({ id:Date.now()+Math.random(), ...item }); el.vaultCount.textContent = state.vaultItems.length; renderVault(); }
  async function mergeSegs(segs) {
    const f = document.createElement('video'); f.src = segs[0].url; await new Promise(r => { f.onloadedmetadata = r; });
    const cw = Math.min(f.videoWidth||1024, 1280) & ~1, ch = Math.round(cw*((f.videoHeight||576)/(f.videoWidth||1024))) & ~1;
    const c = document.createElement('canvas'); c.width = cw; c.height = ch; const ctx = c.getContext('2d'), mime = getVidMime();
    const rec = new MediaRecorder(c.captureStream(24), { mimeType:mime }), chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    const done = new Promise(res => { rec.onstop = () => res(new Blob(chunks, { type:mime })); });
    rec.start();
    for (const s of segs) {
      const v = document.createElement('video'); v.crossOrigin = 'anonymous'; v.muted = true; v.src = s.url;
      await new Promise(r => { v.onloadedmetadata = r; }); await v.play();
      await new Promise(r => { function d(){ if(v.ended||v.paused){r();return;} const sc=Math.min(cw/(v.videoWidth||cw),ch/(v.videoHeight||ch)), dw=(v.videoWidth||cw)*sc, dh=(v.videoHeight||ch)*sc; ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(v,(cw-dw)/2,(ch-dh)/2,dw,dh); requestAnimationFrame(d); } d(); });
    }
    rec.stop(); return await done;
  }

  async function dlItem(item) {
    const a = document.createElement('a');
    if (item.type === 'image') { a.href = item.url; a.download = `studio-yaniv-${Date.now()}.png`; a.click(); return; }
    if (item.segments && item.segments.length > 1) {
      el.downloadsModal.classList.remove('open'); startRenderProgress('מאחד סרטון...', 95);
      const mb = await mergeSegs(item.segments); await finishRenderProgress(true);
      a.href = URL.createObjectURL(mb); a.download = `studio-yaniv-${Date.now()}.webm`; a.click();
    } else { a.href = item.url; a.download = `studio-yaniv-${Date.now()}.webm`; a.click(); }
  }

  function renderVault() {
    if (!state.vaultItems.length) { el.downloadsList.innerHTML = `<div style="text-align:center;color:var(--muted);padding:18px;font-size:.86rem;">ריק</div>`; return; }

      else { const i = document.createElement('img'); i.src = item.url; box.appendChild(i); }
      const acts = document.createElement('div'); acts.className = 'dl-actions';
      const b1 = document.createElement('button'); b1.className = 'dl-btn dl-btn-save'; b1.textContent = '💾 שמור'; b1.onclick = () => dlItem(item);
      const b2 = document.createElement('button'); b2.className = 'dl-btn dl-btn-del'; b2.textContent = '🗑 מחק'; b2.onclick = () => { state.vaultItems = state.vaultItems.filter(x => x.id !== item.id); el.vaultCount.textContent = state.vaultItems.length; renderVault(); };
      acts.append(b1, b2); card.append(box, acts); el.downloadsList.appendChild(card);
    });
  }
