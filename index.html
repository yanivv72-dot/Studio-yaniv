<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />
<title>Studio Yaniv — סטודיו AI מקצועי</title>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
<script id="embeddedKeys" type="application/json">{}</script>
<style>
  :root{--bg:#06080f;--card:#0b101b;--card2:#141c2f;--bd:rgba(255,255,255,.08);--sky:#38bdf8;--blue:#2563eb;--grn:#10b981;--txt:#f8fafc;--mut:#94a3b8;--red:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(7,10,18,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);box-shadow:0 4px 20px rgba(0,0,0,.45)}
  .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13px;line-height:1.1;flex-shrink:0;white-space:nowrap}
  .brand-logo{width:38px;height:38px;display:block;flex-shrink:0;border-radius:9px;box-shadow:0 3px 10px rgba(37,99,235,.4)}
  .hdr-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .seg{display:flex;gap:3px;padding:3px;background:#0c111d;border:1px solid var(--bd);border-radius:10px}
  button{border:none;cursor:pointer;color:inherit;background:none;font:inherit;transition:.15s}
  .btn-pill{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;color:var(--mut)}
  .btn-pill.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
  .btn-white{background:#fff;color:#020617;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}
  .btn-dark{background:#0c111d;border:1px solid var(--bd);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:600}
  .btn-save-html{background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}
  main{width:100%;max-width:880px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:11px;flex:1}
  .stage{position:relative;width:100%;margin:0 auto;aspect-ratio:16/9;max-height:46dvh;background:#03050a;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.65)}
  .stage.r916{aspect-ratio:9/16;max-width:270px;max-height:50dvh}
  .stage.r11{aspect-ratio:1/1;max-width:380px;max-height:46dvh}
  video,img{width:100%;height:100%;object-fit:contain;display:block}
  .hide{display:none!important}
  .bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .icbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .icbtn.save{background:linear-gradient(135deg,var(--blue),var(--sky));border-color:transparent;color:#fff}
  .icbtn.muted-on{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fcd34d}
  .icbtn.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
  .icbtn:disabled{opacity:.35;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .pwrap{position:relative;background:#060911;border:1px solid var(--bd);border-radius:12px;padding:4px 4px 4px 72px}
  .pwrap:focus-within{border-color:rgba(56,189,248,.6)}
  textarea{width:100%;background:transparent;border:none;color:#fff;padding:7px 9px;font-size:14px;resize:none;outline:none}
  .ideaMini,.clrMini{position:absolute;top:7px;width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);font-size:13px;display:flex;align-items:center;justify-content:center}
  .ideaMini{left:7px;color:#38bdf8}
  .clrMini{left:40px;color:#fca5a5;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
  .speechRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .spWrap{position:relative;flex:1;min-width:170px}
  .spWrap input{width:100%;background:#060911;border:1px solid var(--bd);border-radius:10px;padding:8px 10px 8px 34px;color:#fff;font-size:13px;outline:none}
  .spWrap input:focus{border-color:rgba(56,189,248,.6)}
  .clrSp{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.35);color:#fca5a5;font-size:11px;display:flex;align-items:center;justify-content:center}
  select.charSel{background:#060911;border:1px solid var(--bd);border-radius:10px;padding:7px 8px;color:#38bdf8;font-size:11px;font-weight:700;outline:none}
  .sfxToggle{padding:8px 10px;border-radius:10px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--card2);border:1px solid var(--bd);color:var(--mut)}
  .sfxToggle.on{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.45);color:#6ee7b7}
  .keyBar{display:flex;gap:6px;align-items:center;background:#060911;border:1px solid rgba(56,189,248,.4);border-radius:11px;padding:6px 9px;flex-shrink:0;flex-wrap:wrap}
  .keyBar input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none;direction:ltr;min-width:120px}
  .keyBar button{background:linear-gradient(135deg,var(--blue),var(--sky));border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
  .keyBar button.sec{background:var(--card2);border:1px solid var(--bd);color:#cbd5e1}
  .keyBar button.del{background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
  .keyStat{font-size:11px;color:#34d399;font-weight:700;padding:2px 4px;line-height:1.45}
  .keyStat.warn{color:#fbbf24}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .act{width:100%;padding:11px 8px;border-radius:12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0}
  @media(max-width:560px){.grid3{gap:6px}.grid3 .act{padding:10px 4px;font-size:12px}}
  .act.v{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
  .act.b{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
  .act.e{background:linear-gradient(135deg,#059669,#14b8a6);color:#fff}
  .act.x{background:rgba(16,185,129,.16);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
  .act.n{background:var(--card2);border:1px solid var(--bd)}
  .act:disabled{opacity:.35;cursor:not-allowed}
  .upWrap{position:relative}
  .ddMenu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--card2);border:1px solid var(--sky);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.85);display:none;flex-direction:column;overflow:hidden;z-index:40}
  .ddMenu.on{display:flex}
  .ddItem{padding:11px 13px;font-size:13px;font-weight:600;text-align:right;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
  .ddItem:last-child{border-bottom:none}
  .ddItem:hover{background:rgba(56,189,248,.18)}
  .err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fecaca;padding:9px 12px;border-radius:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.45}
  #renderOverlay{position:absolute;inset:0;z-index:30;background:rgba(5,7,12,.95);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
  #renderOverlay.on{display:flex}
  .ringWrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
  .ringPct{position:absolute;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
  .pbar{width:176px;max-width:75%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .pbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .2s ease-out}
  .stopBtn{width:38px;height:38px;border-radius:50%;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.55);color:#fecaca;display:flex;align-items:center;justify-content:center;font-size:14px}
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:12px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:800;gap:8px}
  .mbody{flex:1;min-height:0;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
  .srvRow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;font-size:12px;border:1px solid var(--bd);background:#080c16}
  .srvRow.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.09)}
  .srvRow.pin{border-color:rgba(16,185,129,.85);background:rgba(16,185,129,.18);box-shadow:0 0 14px rgba(16,185,129,.22)}
  .srvRow.cool{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);opacity:.78}
  .srvSt{font-size:11px;font-weight:800;white-space:nowrap}
  .srvSt.ok{color:#34d399}
  .srvSt.cool{color:#fbbf24}
  .vCard{background:#080c16;border:1px solid var(--bd);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .vBox{width:100%;max-height:240px;background:#000;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .vBox video,.vBox img{width:100%;max-height:240px;object-fit:contain}
  .vBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vSave{background:#fff;color:#020617;padding:9px;border-radius:9px;font-weight:800;font-size:13px}
  .vDel{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:9px;border-radius:9px;font-weight:800;font-size:13px}
  .keyGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .keyGrid input{width:100%;background:#060911;border:1px solid var(--bd);color:#fff;padding:7px 9px;border-radius:8px;font-size:11px;direction:ltr}
  .keyGrid input.hasVal{border-color:rgba(16,185,129,.65);background:rgba(16,185,129,.06)}
  @media(max-width:560px){.keyGrid{grid-template-columns:1fr}}
  #camView{width:100%;max-height:280px;background:#000;border-radius:12px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Studio Yaniv">
      <defs>
        <linearGradient id="bgSq" x1="60" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#b4e5ff"/><stop offset="48%" stop-color="#58aef2"/><stop offset="100%" stop-color="#1960ce"/></linearGradient>
        <linearGradient id="rgM" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fff"/><stop offset="35%" stop-color="#cbd5e1"/><stop offset="70%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
        <linearGradient id="syB" x1="35" y1="22" x2="88" y2="98" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#0d6efd"/><stop offset="100%" stop-color="#053b96"/></linearGradient>
      </defs>
      <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bgSq)" stroke="rgba(255,255,255,.45)" stroke-width="2"/>

      <circle cx="77" cy="40" r="6.4" fill="#0d6efd" stroke="#bae6fd" stroke-width="1"/>
      <path d="M26 57 C42 57,54 67,56 97 C58 76,72 56,86 28 C78 52,66 72,57 98 C51 77,39 63,26 57 Z" fill="url(#syB)" stroke="#bae6fd" stroke-width="1" stroke-linejoin="round"/>
    </svg>
    <span>Studio Yaniv</span>
  </div>
  <div class="hdr-tools">
    <div class="seg" id="ratioSeg"><button class="btn-pill on" data-r="16:9">16:9</button><button class="btn-pill" data-r="9:16">9:16</button><button class="btn-pill" data-r="1:1">1:1</button></div>
    <button class="btn-save-html" id="btnDlHtml">&#128190; שמור קוד</button>

    <button class="btn-white" id="btnVault">שמורים (<span id="vCnt">0</span>)</button>
    <button class="btn-dark" id="btnSrvs">שרתים (<span id="sCnt">0</span>)</button>
  </div>
</header>
<main>
  <section class="stage" id="stageBox">
    <div id="emptyPlay" style="width:56px;height:56px;border-radius:50%;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:22px">&#9654;</div>
    <img id="imgView" class="hide" alt="" />
    <video id="vidView" class="hide" playsinline controls></video>

      <div class="ringWrap"><svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg)"><circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5.5"/><circle id="ringArc" cx="38" cy="38" r="30" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><span class="ringPct" id="pctTxt">5%</span></div>
      <div class="pbar"><i id="pBarFill"></i></div>
      <div id="renderSrvName" style="font-size:11px;color:#94a3b8;text-align:center;line-height:1.45"></div>
      <button class="stopBtn" id="btnStopAll" title="הפסק">&#9632;</button>
    </div>
  </section>
  <section class="bar">
    <div class="row"><button class="icbtn save" id="btnDlNow" disabled>&#11015; הורד ושמור</button><button class="icbtn" id="btnMute">&#128266; השתק שמע</button></div>
    <div class="row"><span id="srvUsedBadge" style="font-size:11px;color:#34d399;font-weight:700"></span><button class="icbtn danger" id="btnClear" disabled>מחק</button></div>
  </section>
  <div id="errBox" class="err hide"><span id="errTxt"></span><button onclick="this.parentElement.classList.add('hide')">&#10005;</button></div>
  <section class="card">

      <textarea id="promptBox" rows="2" placeholder="כתוב תיאור (או השאר ריק ליצירה אוטומטית): שינוי, תוספת, אדם אוכל, הפיכה לוידאו..."></textarea>
      <button class="clrMini" id="btnClrPrompt" title="מחק טקסט">&#10005;</button>
      <button class="ideaMini" id="btnIdea" title="רעיון">&#127922;</button>
    </div>
    <div class="speechRow">
      <div class="spWrap"><input id="speechBox" type="text" placeholder="🗣️ מה הדמויות אומרות בסנכרון שפתיים (אופציונלי — שורה לכל דמות)" /><button class="clrSp" id="btnClrSpeech" title="מחק דיבור">&#10005;</button></div>
      <select id="voiceChar" class="charSel" title="קול הדמות"><option value="auto">🎭 זיהוי דמות</option><option value="male">👨 גבר</option><option value="female">👩 אישה</option><option value="child">🧒 ילד</option><option value="elder">👴 מבוגר</option></select>
      <button id="btnAutoSfx" class="sfxToggle on">🔊 קולות AI</button>
    </div>
    <div class="grid3"><button class="act v" id="btnVid">יצירת וידאו</button><button class="act e" id="btnVidEdit">עריכת וידאו</button><button class="act b" id="btnImgEdit">עריכת תמונה</button></div>
    <div class="grid2"><button class="act x" id="btnExtend" disabled>&#9193; הארכת סרטון +6s</button><button class="act n" id="btnAgain" disabled>&#128260; צור שוב</button></div>
  </section>
  <section class="grid2">
    <div class="upWrap"><button class="act n" id="btnUpVidMenu">&#127909; העלאת סרטון &#9662;</button><div class="ddMenu" id="vidMenu"><button class="ddItem" id="optVidGal">&#128193; גלריה (סרטונים בלבד)</button><button class="ddItem" id="optVidCam">&#127909; צילום סרטון במצלמה</button></div><input type="file" id="inVid" accept="video/*" hidden /><input type="file" id="inVidCam" accept="video/*" capture="environment" hidden /></div>
    <div class="upWrap"><button class="act n" id="btnUpImgMenu">&#128444; העלאת תמונה &#9662;</button><div class="ddMenu" id="imgMenu"><button class="ddItem" id="optImgGal">&#128193; גלריה (תמונות בלבד)</button><button class="ddItem" id="optImgCam">&#128247; צילום תמונה במצלמה</button></div><input type="file" id="inImg" accept="image/*" hidden /><input type="file" id="inImgCam" accept="image/*" capture="environment" hidden /></div>

</main>
<div class="modal" id="srvModal" onclick="this.classList.remove('on')">

    <div class="mbody">

      <div class="keyGrid">

</div>
<div class="modal" id="vaultModal" onclick="this.classList.remove('on')"><div class="mbox" style="height:88dvh" onclick="event.stopPropagation()"><div class="mhead"><span>תיקיית השמורים</span><button onclick="document.getElementById('vaultModal').classList.remove('on')">&#10005;</button></div><div class="mbody" id="vaultList"></div></div></div>
<div class="modal" id="camModal"><div class="mbox" onclick="event.stopPropagation()"><div class="mhead"><span id="camTitle">&#128247; מצלמה</span><button id="btnCloseCam">&#10005;</button></div><div class="mbody"><video id="camView" autoplay muted playsinline></video><div class="row" style="justify-content:center"><button class="act b" id="btnSnap" style="display:none;flex:1">&#128248; צלם תמונה</button><button class="act x" id="btnRecStart" style="display:none;flex:1">&#9210; התחל הקלטה</button><button class="act v" id="btnRecStop" style="display:none;flex:1">&#9209; עצור ושמור</button></div></div></div></div>

    if(!ls&&(ap.speechBlob||ap.musicBlob||ap.sfxHint))vb=await applyAudio(vb,ap,st.ctrl.signal,false);else if(ls&&(ap.musicBlob||ap.sfxHint))vb=await applyAudio(vb,{...ap,speechBlob:null},st.ctrl.signal,true);else if(!ls&&st.type==='video'&&!st.muted)vb=await keepOrigAud(st.vidUrl,vb);
    setPct(100);showVid(vb);
  }catch(e){if(!st.ctrl.signal.aborted)setErr(e.message||'שגיאה');}finally{stopRender();updateUi();}
};

$('btnExtend').onclick=async()=>{
  if(!st.type)return setErr('יש להעלות או ליצור סרטון/תמונה תחילה.');st.lastAction='extend';setErr('');st.ctrl=new AbortController();startRender(20);
  try{
    const raw=$('promptBox').value.trim()||'המשך טבעי וחלק עם אותם פנים ורקע',sp=$('speechBox').value.trim(),lf=st.type==='video'?await grabFrame(st.vidUrl,true):await(await fetch(st.imgUrl)).blob();
    setStage(8,26,'מתכנן המשך סצנה ושמע...',5);const[ap,en]=await Promise.all([planAudio(raw,sp,st.ctrl.signal),buildPrompt(raw,'i2v',st.ctrl.signal)]);
    let eb=null,ls=false;setStage(26,84,'מייצר קטע המשך...',18);
    if(ap.speechBlob){try{eb=(await raceServers('lipsync',(s,sg)=>dynCall(s,en,lf,sg,ap.speechBlob),2,st.ctrl.signal)).res;ls=true;}catch(e){if(st.ctrl.signal.aborted)throw e;}}
    if(!eb){eb=(await raceServers('video',(s,sg)=>dynCall(s,en,lf,sg),3,st.ctrl.signal)).res;if(ap.speechBlob)eb=await lipSyncOnVideo(eb,lf,en,ap,st.ctrl.signal,true);else eb=await applyAudio(eb,ap,st.ctrl.signal,false);}
    else if(ap.musicBlob||ap.sfxHint)eb=await applyAudio(eb,{...ap,speechBlob:null},st.ctrl.signal,true);
    setStage(86,98,'מחבר סרטונים...',5);
    if(st.type==='video'){const eu=URL.createObjectURL(eb);try{const mg=await concatVids(st.vidUrl,eu,!st.muted,0);setPct(100);showVid(mg);}finally{URL.revokeObjectURL(eu);}}else{setPct(100);showVid(eb);}
  }catch(e){if(!st.ctrl.signal.aborted)setErr(e.message||'שגיאה');}finally{stopRender();updateUi();}
};

$('btnAgain').onclick=()=>{if(st.lastAction==='vid')$('btnVid').click();else if(st.lastAction==='vidEdit')$('btnVidEdit').click();else if(st.lastAction==='imgEdit')$('btnImgEdit').click();else if(st.lastAction==='extend')$('btnExtend').click();};
window.dlVault=async i=>{const it=st.vault[i];if(!it)return;let b=it.blob;if(it.type==='video'&&st.muted)b=await syncAudioVideo(it.url,null,null,false,true);triggerDownload(b||it.url,'studio-yaniv-'+(it.type==='video'?'video.webm':'image.png'));};
$('btnDlNow').onclick=()=>{if(st.vault.length)window.dlVault(0);};
</script>
