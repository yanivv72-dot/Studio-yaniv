<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />
<title>Studio Yaniv — סטודיו AI מקצועי</title>
<style>
  :root{--bg:#06080f;--card:#0b101b;--card2:#141c2f;--bd:rgba(255,255,255,.08);--sky:#38bdf8;--blue:#2563eb;--txt:#f8fafc;--mut:#94a3b8;--red:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(7,10,18,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);box-shadow:0 4px 20px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .seg{display:flex;gap:3px;padding:3px;background:#0c111d;border:1px solid var(--bd);border-radius:10px}
  button{border:none;cursor:pointer;color:inherit;background:none;font:inherit;transition:.15s}
  .btn-pill{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:var(--mut)}
  .btn-pill.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
  .btn-white{background:#fff;color:#020617;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:800}
  .btn-dark{background:#0c111d;border:1px solid var(--bd);padding:7px 11px;border-radius:10px;font-size:12px;font-weight:600}
  main{width:100%;max-width:880px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
  .stage{position:relative;width:100%;margin:0 auto;aspect-ratio:16/9;max-height:48dvh;background:#03050a;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.65)}
  .stage.r916{aspect-ratio:9/16;max-width:270px;max-height:52dvh}
  .stage.r11{aspect-ratio:1/1;max-width:380px;max-height:48dvh}
  video,img{width:100%;height:100%;object-fit:contain;display:block}
  .hide{display:none!important}
  .bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .icbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .icbtn.muted-on{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fcd34d}
  .icbtn.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .pwrap{position:relative;background:#060911;border:1px solid var(--bd);border-radius:12px;padding:4px 4px 4px 40px}
  .pwrap:focus-within{border-color:rgba(56,189,248,.6)}
  textarea{width:100%;background:transparent;border:none;color:#fff;padding:7px 9px;font-size:14px;resize:none;outline:none}
  .ideaMini{position:absolute;left:7px;top:7px;width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:#38bdf8;font-size:14px;display:flex;align-items:center;justify-content:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media(max-width:560px){.grid3{grid-template-columns:1fr}}
  .act{padding:11px 12px;border-radius:12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .act.v{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
  .act.b{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
  .act.e{background:linear-gradient(135deg,#059669,#14b8a6);color:#fff}
  .act.n{background:var(--card2);border:1px solid var(--bd)}
  .act:disabled{opacity:.35;cursor:not-allowed}
  .err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fecaca;padding:9px 12px;border-radius:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  #renderOverlay{position:absolute;inset:0;z-index:30;background:rgba(5,7,12,.95);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
  #renderOverlay.on{display:flex}
  .ringWrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
  .ringPct{position:absolute;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
  .pbar{width:176px;max-width:75%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .pbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .16s ease-out}
  .stopBtn{width:38px;height:38px;border-radius:50%;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.55);color:#fecaca;display:flex;align-items:center;justify-content:center;font-size:14px}
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:12px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:540px;height:86dvh;max-height:86dvh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:800}
  .mbody{flex:1;min-height:0;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px}
  .srvRow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#080c16;border:1px solid var(--bd);padding:8px 10px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand"><span>Studio Yaniv</span></div>
  <div class="row">
    <div class="seg" id="ratioSeg">
      <button class="btn-pill on" data-r="16:9">16:9</button>
      <button class="btn-pill" data-r="9:16">9:16</button>
      <button class="btn-pill" data-r="1:1">1:1</button>
    </div>
    <button class="btn-dark" id="btnCopyHtml" title="העתק קוד HTML">העתק</button>
    <button class="btn-white" id="btnVault">שמורים (<span id="vCnt">0</span>)</button>
    <button class="btn-dark" id="btnSrvs">שרתים (<span id="sCnt">0</span>)</button>
  </div>
</header>

<main>
  <section class="stage" id="stageBox">
    <div id="emptyPlay" style="width:56px;height:56px;border-radius:50%;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:22px">&#9654;</div>
    <img id="imgView" class="hide" alt="" />
    <video id="vidView" class="hide" playsinline controls></video>
    <div id="renderOverlay">
      <div class="ringWrap">
        <svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg)">
          <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5.5"></circle>
          <circle id="ringArc" cx="38" cy="38" r="30" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"></circle>
        </svg>
        <span class="ringPct" id="pctTxt">5%</span>
      </div>
      <div class="pbar"><i id="pBarFill"></i></div>
      <button class="stopBtn" id="btnStopAll" aria-label="הפסק מחק" title="הפסק מחק">&#9632;</button>
    </div>
  </section>

  <section class="bar">
    <div class="row">
      <button class="icbtn" id="btnMute" title="השתק שמע להורדה ללא סאונד">&#128266; השתק שמע</button>
      <button class="icbtn" id="btnDlNow" disabled>&#11015; הורד</button>
    </div>
    <div class="row">
      <button class="icbtn danger" id="btnClear" disabled>מחק</button>
    </div>
  </section>

  <div id="errBox" class="err hide"><span id="errTxt"></span><button onclick="this.parentElement.classList.add('hide')">&#10005;</button></div>

  <section class="card">
    <div class="pwrap">
      <textarea id="promptBox" rows="2" placeholder="כתוב תיאור ליצירת וידאו (מתמונה וטקסט / מטקסט / מתמונה), עריכת תמונה או עריכת וידאו..."></textarea>
      <button class="ideaMini" id="btnIdea" title="רעיון מפתיע">&#127922;</button>
    </div>
    <div class="grid3">
      <button class="act v" id="btnVid">יצירת וידאו</button>
      <button class="act b" id="btnImgEdit">עריכת תמונה</button>
      <button class="act e" id="btnVidEdit">עריכת וידאו</button>
    </div>
  </section>

  <section class="grid2">
    <button class="act n" onclick="document.getElementById('inVid').click()">העלאת סרטון</button>
    <button class="act n" onclick="document.getElementById('inImg').click()">העלאת תמונה</button>
    <input type="file" id="inVid" accept="video/*" hidden />
    <input type="file" id="inImg" accept="image/*" hidden />
  </section>
</main>

<div class="modal" id="srvModal" onclick="this.classList.remove('on')">
  <div class="mbox" onclick="event.stopPropagation()">
    <div class="mhead"><span>שרתי AI חינמיים (מעבר אוטומטי)</span><button onclick="document.getElementById('srvModal').classList.remove('on')">&#10005;</button></div>
    <div class="mbody" id="srvList"></div>
  </div>
</div>

<div class="modal" id="vaultModal" onclick="this.classList.remove('on')">
  <div class="mbox" onclick="event.stopPropagation()">
    <div class="mhead"><span>תיקיית הורדות</span><button onclick="document.getElementById('vaultModal').classList.remove('on')">&#10005;</button></div>
    <div class="mbody" id="vaultList"></div>
  </div>
</div>

let progTmr = null, curPct = 5;
function startRender(expSec=10){
  curPct = 5; setRenderPct(5);
  $('emptyPlay').classList.add('hide');
  $('renderOverlay').classList.add('on');
  const t0 = performance.now();
  clearInterval(progTmr);
  progTmr = setInterval(()=>{
    const el = (performance.now()-t0)/1000;
    curPct = Math.max(curPct, Math.min(94, 6 + 86*(1-Math.exp(-el/Math.max(3,expSec*0.65)))));
    setRenderPct(curPct);
  }, 150);
}
function setRenderPct(p){
  const v = Math.round(Math.max(1,Math.min(100,p)));
  $('pctTxt').textContent = v+'%'; $('pBarFill').style.width = v+'%';

function rotated(cat){
  const now = Date.now();
  let arr = SERVERS.filter(s => s.cat===cat && (!st.cd[s.id] || st.cd[s.id]<=now));
  if(!arr.length) arr = SERVERS.filter(s => s.cat===cat);
  const proven = arr.filter(s => (st.perf[s.id]?.ok||0)>0 && !(st.perf[s.id]?.fail||0));
  const fresh = arr.filter(s => !st.perf[s.id] || !(st.perf[s.id]?.fail||0) && !(st.perf[s.id]?.ok||0));
  const deg = arr.filter(s => (st.perf[s.id]?.fail||0)>0);
  const idx = st.rot[cat]||0; st.rot[cat] = idx+1;
  const rotA = a => a.length<=1 ? a : [...a.slice(idx%a.length), ...a.slice(0,idx%a.length)];
  return [...rotA(proven), ...rotA(fresh), ...rotA(deg)];
}

async function translateHe(txt, sig){
  if(!/[\u0590-\u05FF]/.test(txt)) return txt;
  try{
    const r = await fetch('https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json'},signal:sig,
      body:JSON.stringify({model:'Qwen3.5-9B',messages:[{role:'user',content:'Translate to concise English visual prompt only: '+txt}],max_tokens:180})
    });
    if(r.ok){ const j = await r.json(); const out = j?.choices?.[0]?.message?.content?.trim(); if(out) return out; }
  }catch{}
  try{
    const mr = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair=he|en',{signal:sig});
    const mj = await mr.json(); const c = mj?.responseData?.translatedText;
    if(c && !/[\u0590-\u05FF]/.test(c)) return c;
  }catch{}
  return txt;
}

async function uploadBlob(host, blob, name, sig){
  const fd = new FormData(); fd.append('files', blob, name);
  const r = await fetch('https://'+host+'/gradio_api/upload',{method:'POST',body:fd,signal:sig});
  const arr = await r.json(); return {path:arr[0], meta:{_type:'gradio.FileData'}};
}

async function callGradio(host, ep, data, sig, timeoutMs=45000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), timeoutMs);
  sig?.addEventListener('abort', ()=>c.abort());
  try{
    const pr = await fetch('https://'+host+'/gradio_api/call/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data}),signal:c.signal});
    const {event_id} = await pr.json();
    const sr = await fetch('https://'+host+'/gradio_api/call/'+ep+'/'+event_id,{signal:c.signal});
    const txt = await sr.text();
    const lines = txt.split('\n');
    for(let i=0;i<lines.length;i++){
      if(lines[i].startsWith('event: error')){
        const d = (lines[i+1]||'').replace(/^data:\s*/,'').trim();
        const isQ = /quota|limit|exceeded|zerogpu/i.test(d) || (host.endsWith('.hf.space') && (d==='null'||d==='{"error":null}'||d==='{"error": null}'));
        throw new Error(isQ ? 'ZeroGPU quota exceeded' : ('Space error: '+d.slice(0,60)));
      }
      if(lines[i].startsWith('event: complete')){
        const d = lines[i+1]?.replace(/^data:\s*/,'');
        if(d) return JSON.parse(d);
      }
    }
    throw new Error('No complete event');
  }finally{ clearTimeout(t); }
}

function findUrl(res){
  for(const it of res||[]){
    if(!it) continue;
    if(typeof it==='string' && (it.startsWith('http')||it.startsWith('data:'))) return it;
    if(it.url) return it.url;
    if(it.video?.url) return it.video.url;
    if(it.image?.url) return it.image.url;
    if(it.audio?.url) return it.audio.url;
    if(Array.isArray(it) && it[0]?.url) return it[0].url;
  }
  return null;
}

async function blobToHordeWebp(blob){
  const img = new Image();
  const u = URL.createObjectURL(blob);
  img.src = u;
  await new Promise(r => img.onload = r);
  const w0 = img.naturalWidth||512, h0 = img.naturalHeight||512;
  const sc = Math.min(1, 512/Math.max(w0,h0));
  const w = Math.max(256, Math.round((w0*sc)/64)*64), h = Math.max(256, Math.round((h0*sc)/64)*64);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(u);
  return { w, h, b64: c.toDataURL('image/webp',0.88).split(',')[1] };
}

async function callHorde(specId, prompt, w, h, imgBlob, sig){
  const body = {
    prompt,
    models: HORDE_MODELS[specId] || ['Deliberate', "ICBINP - I Can't Believe It's Not Photography", 'AlbedoBase XL 3.1', 'stable_diffusion'],
    params: { width: Math.min(640,Math.max(256,Math.round(w/64)*64)), height: Math.min(640,Math.max(256,Math.round(h/64)*64)), steps: 22, cfg_scale: 7.2, clip_skip: 1, sampler_name: 'k_euler_a', n: 1, denoising_strength: 0.56 },
    nsfw: false, censor_nsfw: true, r2: true
  };
  if(imgBlob){
    const hw = await blobToHordeWebp(imgBlob);
    body.params.width = hw.w; body.params.height = hw.h;
    body.source_image = hw.b64; body.source_processing = 'img2img';
  }
  const sr = await fetch('https://aihorde.net/api/v2/generate/async',{
    method:'POST', headers:{'Content-Type':'application/json',apikey:'0000000000','Client-Agent':'StudioYaniv:2.1:standalone'},
    body: JSON.stringify(body), signal:sig
  });
  if(!sr.ok) throw new Error('Horde '+sr.status);
  const {id} = await sr.json();
  for(let i=0;i<36;i++){
    if(sig?.aborted) throw new Error('Aborted');
    await new Promise(r=>setTimeout(r,1100));
    const ck = await (await fetch('https://aihorde.net/api/v2/generate/check/'+id,{signal:sig})).json();
    if(ck.faulted) throw new Error('Horde faulted');
    if(ck.done){
      const stR = await (await fetch('https://aihorde.net/api/v2/generate/status/'+id,{signal:sig})).json();
      const u = stR?.generations?.[0]?.img;
      if(u && u.startsWith('http')) return await (await fetch(u,{signal:sig})).blob();
      if(u) return await (await fetch('data:image/webp;base64,'+u)).blob();
    }
  }
  throw new Error('Horde timeout');
}

async function dynCall(spec, prompt, imgBlob, sig){
  const dims = st.ratio==='9:16'?[576,1024]:st.ratio==='1:1'?[1024,1024]:[1024,576];
  if(spec.id==='t2i-pollinations-z' || spec.id==='t2i-pollinations-sana'){
    const mod = spec.id==='t2i-pollinations-sana' ? 'sana' : 'zimage';
    const seed = Math.floor(Math.random()*999999);
    const urls = mod==='sana'
      ? ['https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?model=sana&width='+dims[0]+'&height='+dims[1]+'&seed='+seed+'&nologo=true',
         'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?model=flux&width='+dims[0]+'&height='+dims[1]+'&seed='+seed+'&nologo=true']
      : ['https://gen.pollinations.ai/image/'+encodeURIComponent(prompt)+'?model=zimage&width='+dims[0]+'&height='+dims[1]+'&seed='+seed+'&nologo=true',
         'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?model=sana&width='+dims[0]+'&height='+dims[1]+'&seed='+seed+'&nologo=true'];
    for(const pu of urls){
      try{
        const pr = await fetch(pu,{signal:sig});
        if(pr.ok){ const b = await pr.blob(); if(b.size>1500) return b; }
      }catch{}
    }
    throw new Error('Pollinations unavailable');
  }
  if(spec.id.startsWith('t2i-horde') || spec.id.startsWith('ed-horde')){
    return await callHorde(spec.id, prompt, dims[0], dims[1], imgBlob, sig);
  }
  const info = await (await fetch('https://'+spec.host+'/gradio_api/info',{signal:sig})).json();
  const eps = info.named_endpoints||{};
  const keys = Object.keys(eps).filter(k=>!/clear|reset|example|update|toggle|load|lora|smart_config|policy|refresh|status|lambda/i.test(k));
  const ek = (!imgBlob && eps['/text_to_video'] ? '/text_to_video' : null) || (imgBlob && eps['/image_to_video'] ? '/image_to_video' : null) || (spec.ep && eps['/'+spec.ep] ? '/'+spec.ep : null) || keys.find(k=>/edit|infer|generate|run|tts|audio/i.test(k)) || keys[0];
  const up = imgBlob ? await uploadBlob(spec.host, imgBlob, 'src.jpg', sig) : null;
  let im=false, pr=false;
  const data = (eps[ek].parameters||[]).map(p=>{
    const n = ((p.parameter_name||'')+' '+(p.label||'')).toLowerCase();
    const py = (p.python_type?.type||'').toLowerCase();
    if(!im && up && (py.includes('file') || /image|img|input_image/.test(n))){
      im=true; return py.includes('dict(image') ? [{image:up,caption:null}] : py.startsWith('list') ? [up] : up;
    }
    if(!pr && /prompt|instruction|text/.test(n) && !/negative/.test(n)){ pr=true; return prompt; }
    if(/width/.test(n)) return dims[0];
    if(/height/.test(n)) return dims[1];
    if(/step/.test(n)) return Math.min(Number(p.parameter_default)||8, 8);
    if(/camera_lora/.test(n) && p.type?.enum?.includes('Static')) return 'Static';
    return p.parameter_has_default ? p.parameter_default : (p.type?.type==='boolean'?true:1);
  });
  const res = await callGradio(spec.host, ek.replace(/^\//,''), data, sig, spec.cat==='video'?60000:22000);
  const u = findUrl(res); if(!u) throw new Error('No media URL');
  return await (await fetch(u,{signal:sig})).blob();
}

async function raceServers(cat, fn, batch=3, sig){
  let rem = rotated(cat), zHits = 0;
  while(rem.length>0){
    if(sig.aborted) throw new Error('Aborted');
    if(zHits>=3){ rem = rem.filter(s=>!isZeroGpu(s)); if(!rem.length) break; }
    const b = rem.slice(0,batch); rem = rem.slice(batch);
    const cs = b.map(()=>new AbortController());
    sig.addEventListener('abort',()=>cs.forEach(c=>c.abort()));
    let qErr = 0;
    try{
      return await Promise.any(b.map(async (s,j)=>{
        try{ const res = await fn(s, cs[j].signal); cs.forEach((x,k)=>{if(k!==j)x.abort();}); st.perf[s.id]={ok:(st.perf[s.id]?.ok||0)+1,fail:0}; st.cd[s.id]=Date.now()+12000; return {res, s}; }
        catch(e){ st.perf[s.id]={ok:st.perf[s.id]?.ok||0,fail:(st.perf[s.id]?.fail||0)+1}; if(/quota|exceeded|limit|429/i.test(String(e?.message||'')) && isZeroGpu(s)) qErr++; st.cd[s.id] = Date.now() + (s.ref||2)*60000; throw e; }
      }));
    }catch{
      if(sig.aborted) throw new Error('Aborted');
      zHits += qErr;
    }
  }
  throw new Error('ZeroGPU IP quota exhausted');
}

async function renderMotionVideoFromBlob(imgBlob, rawPrompt, sig){
  const img = new Image();
  const u = URL.createObjectURL(imgBlob); img.src = u;
  await new Promise(r => img.onload = r);
  const asp = (img.naturalWidth||1024)/(img.naturalHeight||576);
  const cW = (asp>=1?1024:Math.round(768*asp)) & ~1, cH = Math.round(cW/asp) & ~1;
  const c = document.createElement('canvas'); c.width=cW; c.height=cH;
  const ctx = c.getContext('2d');
  const rec = new MediaRecorder(c.captureStream(24), {mimeType:'video/webm', videoBitsPerSecond:3200000});
  const ch=[]; rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const done = new Promise(res=>rec.onstop=()=>{URL.revokeObjectURL(u); res(new Blob(ch,{type:'video/webm'}));});
  const t = rawPrompt.toLowerCase();
  const snow=/שלג|חורף|snow/i.test(t), rain=/גשם|rain/i.test(t), fire=/אש|fire|spark/i.test(t);
  const pts = Array.from({length:snow||rain||fire?36:0},(_,k)=>({x:(k*71)%cW,y:(k*131)%cH,v:1.5+(k%4)}));
  rec.start();
  let f=0, tot=96;
  await new Promise(res=>{
    const tick=()=>{
      if(sig?.aborted || f>=tot){ rec.stop(); res(); return; }
      const p=f/tot, z=1+0.055*(0.5-0.5*Math.cos(p*Math.PI)), dw=cW*z, dh=cH*z;
      ctx.clearRect(0,0,cW,cH);
      ctx.drawImage(img,(cW-dw)/2+Math.sin(p*6.28)*cW*0.01,(cH-dh)/2+Math.cos(p*6.28)*cH*0.008,dw,dh);
      for(const pt of pts){
        if(rain){ pt.y=(pt.y+pt.v*7)%cH; ctx.strokeStyle='rgba(186,230,253,.5)'; ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x-3,pt.y+12); ctx.stroke(); }
        else if(fire){ pt.y=(pt.y-pt.v*2+cH)%cH; ctx.fillStyle='rgba(251,146,60,.65)'; ctx.beginPath(); ctx.arc(pt.x,pt.y,2,0,6.28); ctx.fill(); }
        else { pt.y=(pt.y+pt.v*1.4)%cH; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(pt.x,pt.y,2.2,0,6.28); ctx.fill(); }
      }
      f++; setTimeout(tick,41);
    };
    tick();
  });
  return await done;
}

function encodeWav(samples, sr){
  const buf=new ArrayBuffer(44+samples.length*2), v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF'); v.setUint32(4,36+samples.length*2,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,samples.length*2,true);
  for(let i=0;i<samples.length;i++){const x=Math.max(-1,Math.min(1,samples[i])); v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true);}
  return new Blob([buf],{type:'audio/wav'});
}

async function composeSpeechLine(raw, sig){
  const qm = raw.match(/["'״׳]([^"'״׳]{2,140})["'״׳]/);
  if(qm) return qm[1].trim();
  const am = raw.match(/(?:אומר|אומרת|אומרים|תגיד|שיגיד|לומר|להגיד|says?|saying)\s+(?:ש)?(.{2,120})/i);
  if(am?.[1]) return am[1].trim();
  const isHe = /[\u0590-\u05FF]/.test(raw);
  try{
    const r = await fetch('https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json'},signal:sig,
      body:JSON.stringify({model:'Qwen3.5-9B',messages:[{role:'user',content:(isHe?'כתוב משפט דיבור קצר וטבעי בעברית (בלי מרכאות) שמתאים להנחיה: ':'Write 1 short spoken line matching: ')+raw}],max_tokens:120})
    });
    if(r.ok){ const j = await r.json(); const out = j?.choices?.[0]?.message?.content?.replace(/^["'״׳]+|["'״׳]+$/g,'').trim(); if(out) return out; }
  }catch{}
  return isHe ? 'שלום לכולם! איזה יום נהדר.' : 'Hello everyone! Great to see you today.';
}

async function synthAudioForPrompt(raw, sig){
  const hasLaugh = /(צחוק|צוחק|צוחקת|צוחקים|חחח|laugh)/i.test(raw);
  const hasSpeech = /(מדבר|מדברת|מדברים|לדבר|דיבר|שידבר|תדבר|אומר|אומרת|תגיד|שיגיד|דיבור|דיבוב|דובב|לספר|בדיחה|נאום|קריינות|talk|speak|speech|say|dialogue)/i.test(raw);
  const spoken = hasSpeech ? await composeSpeechLine(raw, sig) : raw;
  if(hasSpeech || hasLaugh){
    const ttsList = rotated('audio').filter(x=>!x.id.includes('music') && !x.id.includes('acestep'));
    const ordered = /[\u0590-\u05FF]/.test(spoken) ? [...ttsList.filter(x=>x.id==='aud-edge-tts'), ...ttsList.filter(x=>x.id!=='aud-edge-tts')] : ttsList;
    for(const s of ordered){
      try{ return await dynCall(s, (hasLaugh && !hasSpeech)?'[S1] (laughs) '+spoken:spoken, null, sig); }catch{}
    }
    if(hasSpeech && !hasLaugh) throw new Error('שרתי הדיבור עמוסים כרגע, נסה שוב');
  }
  const sr=24000, dur=4.0, ctx=new OfflineAudioContext(1,sr*dur,sr), m=ctx.createGain();
  m.gain.value=.55; m.connect(ctx.destination);
  if(hasLaugh && !hasSpeech){
    for(let i=0;i<7;i++){
      const t=.1+i*.38, o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(260-i*10,t); f.type='bandpass'; f.frequency.value=820; f.Q.value=3.2;
      g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.85,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+.28);
      o.connect(f); f.connect(g); g.connect(m); o.start(t); o.stop(t+.3);
    }
  } else {
    [220,277.18,329.63].forEach((fr,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=fr;
      g.gain.setValueAtTime(.001,i*.3); g.gain.linearRampToValueAtTime(.18,i*.3+.5); g.gain.exponentialRampToValueAtTime(.02,dur);
      o.connect(g); g.connect(m); o.start(i*.3); o.stop(dur);
    });
  }
  return encodeWav((await ctx.startRendering()).getChannelData(0), sr);
}

async function muxOrStripVideo(vUrl, aBlob, keepOrig=false, strip=false, loopAud=true){
  const v=document.createElement('video'); v.crossOrigin='anonymous'; v.muted=!keepOrig||strip; v.src=vUrl;
  await new Promise(r=>v.onloadedmetadata=r);
  const c=document.createElement('canvas'); c.width=(v.videoWidth||1024)&~1; c.height=(v.videoHeight||576)&~1;
  const ctx=c.getContext('2d');
  let tracks=[...c.captureStream(24).getVideoTracks()], actx=null, srcNode=null;
  if(!strip && aBlob){
    actx=new AudioContext(); await actx.resume().catch(()=>{});
    const ab=await actx.decodeAudioData(await aBlob.arrayBuffer());
    srcNode=actx.createBufferSource(); srcNode.buffer=ab; srcNode.loop=loopAud && ab.duration<(v.duration||5);
    const dest=actx.createMediaStreamDestination(); srcNode.connect(dest);
    if(keepOrig){ try{ const es=actx.createMediaElementSource(v); es.connect(dest); }catch{} }
    tracks.push(...dest.stream.getAudioTracks());
  }
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:'video/webm'});
  const ch=[]; rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const done=new Promise(res=>rec.onstop=()=>{try{srcNode?.stop()}catch{} actx?.close().catch(()=>{}); res(new Blob(ch,{type:'video/webm'}));});
  rec.start(); srcNode?.start(0); await v.play();
  (function d(){ if(v.ended||v.paused){rec.stop();return;} ctx.drawImage(v,0,0,c.width,c.height); requestAnimationFrame(d); })();
  return await done;
}

async function captureVidFrame(url, atEnd=false){
  const v=document.createElement('video'); v.crossOrigin='anonymous'; v.src=url;
  await new Promise(r=>v.onloadedmetadata=r);
  v.currentTime=atEnd?Math.max(0,(v.duration||1)-.05):.05;
  await new Promise(r=>v.onseeked=r);
  const c=document.createElement('canvas'); c.width=v.videoWidth||1024; c.height=v.videoHeight||576;
  c.getContext('2d').drawImage(v,0,0);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}

function showImg(b){ st.type='image'; st.imgUrl=URL.createObjectURL(b); $('imgView').src=st.imgUrl; st.vault.unshift({type:'image',url:st.imgUrl,blob:b}); updateUi(); }
function showVid(b){ st.type='video'; st.vidBlob=b; st.vidUrl=URL.createObjectURL(b); $('vidView').src=st.vidUrl; $('vidView').play().catch(()=>{}); st.vault.unshift({type:'video',url:st.vidUrl,blob:b}); updateUi(); }

// 1) עריכת תמונה
$('btnImgEdit').onclick = async () => {
  const raw = $('promptBox').value.trim(); if(!raw) return setErr('יש לכתוב תיאור עריכה או יצירת תמונה.');
  setErr(''); st.ctrl = new AbortController(); startRender(8);
  try{
    const en = await translateHe(raw, st.ctrl.signal);
    const srcBlob = st.type==='image' ? await (await fetch(st.imgUrl)).blob() : st.type==='video' ? await captureVidFrame(st.vidUrl, false) : null;
    if(srcBlob){
      const {res} = await raceServers('edit',(s,sig)=>dynCall(s,en,srcBlob,sig),3,st.ctrl.signal);
      setRenderPct(100); showImg(res);
    } else {
      const {res} = await raceServers('image',(s,sig)=>dynCall(s,en,null,sig),3,st.ctrl.signal);
      setRenderPct(100); showImg(res);
    }
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 2) יצירת וידאו (מתמונה+טקסט / טקסט בלבד / תמונה בלבד)
$('btnVid').onclick = async () => {
  const raw = $('promptBox').value.trim();
  const refBlob = st.type==='image' ? await (await fetch(st.imgUrl)).blob() : null;
  if(!raw && !refBlob) return setErr('יש לכתוב תיאור לסרטון או להעלות תמונה (או שניהם יחד).');
  setErr(''); st.ctrl = new AbortController(); startRender(16);
  try{
    const en = await translateHe(raw||'smooth cinematic motion', st.ctrl.signal);
    const audProm = raw ? synthAudioForPrompt(raw, st.ctrl.signal) : Promise.resolve(null);
    let vb;
    try{ vb = (await raceServers('video',(s,sig)=>dynCall(s,en,refBlob,sig),2,st.ctrl.signal)).res; }
    catch{
      if(st.ctrl.signal.aborted) throw new Error('Aborted');
      const kf = refBlob || (await raceServers('image',(s,sig)=>dynCall(s,en,null,sig),3,st.ctrl.signal)).res;
      try{ vb = (await raceServers('video',(s,sig)=>dynCall(s,en,kf,sig),2,st.ctrl.signal)).res; }
      catch{
        if(st.ctrl.signal.aborted) throw new Error('Aborted');
        vb = await renderMotionVideoFromBlob(kf, raw||en, st.ctrl.signal);
      }
    }
    const ab = await audProm;
    const out = ab ? await muxOrStripVideo(URL.createObjectURL(vb), ab, false, false) : vb;
    setRenderPct(100); showVid(out);
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 3) עריכת וידאו
$('btnVidEdit').onclick = async () => {
  const raw = $('promptBox').value.trim(); if(!raw) return setErr('יש לתאר בטקסט מה להוסיף או לערוך בסרטון.');
  if(st.type!=='video') return setErr('יש להעלות או ליצור סרטון תחילה כדי לערוך אותו.');
  setErr(''); st.ctrl = new AbortController(); startRender(18);
  try{
    const stripped = raw.replace(/["'״׳][^"'״׳]*["'״׳]/g,' ').replace(/(?:מדבר|לדבר|מספר|תדבר|שידבר|אומר|תגיד|שיגיד)\s+(?:על|ש|את)\s+.+$/i,' ');
    const isSp = /(מדבר|מדברת|מדברים|לדבר|דיבר|שידבר|תדבר|אומר|אומרת|תגיד|שיגיד|דיבור|דיבוב|דובב|לספר|בדיחה|talk|speak|speech|say)/i.test(raw);
    const audioOnly = (isSp || /(צחוק|צוחק|מוזיקה|שמע|סאונד|קול|laugh|voice|music)/i.test(raw)) && !/(משקפיים|כובע|שלג|רקע|אלמנט|צבע|חולצה|החלף|תוריד|add a |put a )/i.test(stripped);
    if(audioOnly){
      const ab = await synthAudioForPrompt(raw, st.ctrl.signal);
      const out = await muxOrStripVideo(st.vidUrl, ab, !st.muted, false, !isSp);
      setRenderPct(100); showVid(out); return;
    }
    const en = await translateHe(raw, st.ctrl.signal);
    const frBlob = await captureVidFrame(st.vidUrl, false);
    let editedImg = frBlob;
    try{ editedImg = (await raceServers('edit',(s,sig)=>dynCall(s,en,frBlob,sig),3,st.ctrl.signal)).res; }
    catch(e){ if(st.ctrl.signal.aborted) throw e; }
    let vidBlob;
    try{ vidBlob = (await raceServers('video',(s,sig)=>dynCall(s,en,editedImg,sig),2,st.ctrl.signal)).res; }
    catch(e){ if(st.ctrl.signal.aborted) throw e; vidBlob = await renderMotionVideoFromBlob(editedImg, raw, st.ctrl.signal); }
    const ab = await synthAudioForPrompt(raw, st.ctrl.signal);
    const finalV = await muxOrStripVideo(URL.createObjectURL(vidBlob), ab, false, false, !isSp);
    setRenderPct(100); showVid(finalV);
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

$('inImg').onchange = e => { const f=e.target.files?.[0]; if(f) showImg(f); e.target.value=''; };
$('inVid').onchange = e => { const f=e.target.files?.[0]; if(f) showVid(f); e.target.value=''; };

window.dlVault = async (idx) => {
  const item = st.vault[idx]; if(!item) return;
  let url = item.url;
  if(item.type==='video' && st.muted){
    const silent = await muxOrStripVideo(item.url, null, false, true);
    url = URL.createObjectURL(silent);
  }
  const a=document.createElement('a'); a.href=url; a.download='studio-yaniv-'+(item.type==='video'?'video.webm':'image.png'); a.click();
};
$('btnDlNow').onclick = () => { if(st.vault.length) window.dlVault(0); };
