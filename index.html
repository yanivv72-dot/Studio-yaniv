<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />
<title>Studio Yaniv — סטודיו AI מקצועי</title>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
<script id="embeddedKeys" type="application/json">{}</script>
<style>
  :root{--bg:#06080f;--card:#0b101b;--card2:#141c2f;--bd:rgba(255,255,255,.08);--sky:#38bdf8;--blue:#2563eb;--grn:#10b981;--txt:#f8fafc;--mut:#94a3b8;--red:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(7,10,18,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);box-shadow:0 4px 20px rgba(0,0,0,.45)}
  .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13px;line-height:1.1;flex-shrink:0;white-space:nowrap}
  .brand-logo{width:38px;height:38px;display:block;flex-shrink:0;border-radius:9px;box-shadow:0 3px 10px rgba(37,99,235,.4)}
  .hdr-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .seg{display:flex;gap:3px;padding:3px;background:#0c111d;border:1px solid var(--bd);border-radius:10px}
  button{border:none;cursor:pointer;color:inherit;background:none;font:inherit;transition:.15s}
  .btn-pill{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;color:var(--mut)}
  .btn-pill.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
  .btn-white{background:#fff;color:#020617;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}
  .btn-dark{background:#0c111d;border:1px solid var(--bd);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:600}
  main{width:100%;max-width:880px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:11px;flex:1}
  .stage{position:relative;width:100%;margin:0 auto;aspect-ratio:16/9;max-height:46dvh;background:#03050a;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.65)}
  .stage.r916{aspect-ratio:9/16;max-width:270px;max-height:50dvh}
  .stage.r11{aspect-ratio:1/1;max-width:380px;max-height:46dvh}
  video,img{width:100%;height:100%;object-fit:contain;display:block}
  .hide{display:none!important}
  .bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .icbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .icbtn.muted-on{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fcd34d}
  .icbtn.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
  .icbtn:disabled{opacity:.35;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .pwrap{position:relative;background:#060911;border:1px solid var(--bd);border-radius:12px;padding:4px 4px 4px 40px}
  .pwrap:focus-within{border-color:rgba(56,189,248,.6)}
  textarea{width:100%;background:transparent;border:none;color:#fff;padding:7px 9px;font-size:14px;resize:none;outline:none}
  .ideaMini{position:absolute;left:7px;top:7px;width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:#38bdf8;font-size:14px;display:flex;align-items:center;justify-content:center}
  .keyBar{display:flex;gap:6px;align-items:center;background:#060911;border:1px solid rgba(56,189,248,.4);border-radius:11px;padding:6px 9px;flex-shrink:0}
  .keyBar input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none;direction:ltr;min-width:0}
  .keyBar button{background:linear-gradient(135deg,var(--blue),var(--sky));border-radius:8px;padding:6px 11px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
  .keyBar button.sec{background:var(--card2);border:1px solid var(--bd);color:#cbd5e1}
  .keyStat{font-size:11px;color:#34d399;font-weight:700;padding:2px 4px;line-height:1.45}
  .keyStat.warn{color:#fbbf24}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .act{width:100%;padding:11px 8px;border-radius:12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0}
  @media(max-width:560px){.grid3{gap:6px}.grid3 .act{padding:10px 4px;font-size:12px}}
  .act.v{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
  .act.b{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
  .act.e{background:linear-gradient(135deg,#059669,#14b8a6);color:#fff}
  .act.x{background:rgba(16,185,129,.16);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
  .act.n{background:var(--card2);border:1px solid var(--bd)}
  .act:disabled{opacity:.35;cursor:not-allowed}
  .upWrap{position:relative}
  .ddMenu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--card2);border:1px solid var(--sky);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.85);display:none;flex-direction:column;overflow:hidden;z-index:40}
  .ddMenu.on{display:flex}
  .ddItem{padding:11px 13px;font-size:13px;font-weight:600;text-align:right;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
  .ddItem:last-child{border-bottom:none}
  .ddItem:hover{background:rgba(56,189,248,.18)}
  .err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fecaca;padding:9px 12px;border-radius:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.45}
  #renderOverlay{position:absolute;inset:0;z-index:30;background:rgba(5,7,12,.95);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
  #renderOverlay.on{display:flex}
  .ringWrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
  .ringPct{position:absolute;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
  .pbar{width:176px;max-width:75%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .pbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .16s ease-out}
  .stopBtn{width:38px;height:38px;border-radius:50%;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.55);color:#fecaca;display:flex;align-items:center;justify-content:center;font-size:14px}
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:12px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:800;gap:8px}
  .mbody{flex:1;min-height:0;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
  .srvRow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;font-size:12px;border:1px solid var(--bd);background:#080c16}
  .srvRow.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.09)}
  .srvRow.pin{border-color:rgba(16,185,129,.85);background:rgba(16,185,129,.18);box-shadow:0 0 14px rgba(16,185,129,.22)}
  .srvRow.cool{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);opacity:.78}
  .srvSt{font-size:11px;font-weight:800;white-space:nowrap}
  .srvSt.ok{color:#34d399}
  .srvSt.cool{color:#fbbf24}
  .vCard{background:#080c16;border:1px solid var(--bd);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .vBox{width:100%;max-height:240px;background:#000;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .vBox video,.vBox img{width:100%;max-height:240px;object-fit:contain}
  .vBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vSave{background:#fff;color:#020617;padding:9px;border-radius:9px;font-weight:800;font-size:13px}
  .vDel{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:9px;border-radius:9px;font-weight:800;font-size:13px}
  .keyGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .keyGrid input{width:100%;background:#060911;border:1px solid var(--bd);color:#fff;padding:7px 9px;border-radius:8px;font-size:11px;direction:ltr}
  .keyGrid input.hasVal{border-color:rgba(16,185,129,.65);background:rgba(16,185,129,.06)}
  @media(max-width:560px){.keyGrid{grid-template-columns:1fr}}
  #camView{width:100%;max-height:280px;background:#000;border-radius:12px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Studio Yaniv Logo">
      <defs>
        <linearGradient id="bgSquircle" x1="60" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#b4e5ff"/>
          <stop offset="48%" stop-color="#58aef2"/>
          <stop offset="100%" stop-color="#1960ce"/>
        </linearGradient>
        <linearGradient id="ringMetal" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#cbd5e1"/>
          <stop offset="65%" stop-color="#f8fafc"/>
          <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>
        <linearGradient id="syBlue" x1="35" y1="22" x2="88" y2="98" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#0d6efd"/>
          <stop offset="100%" stop-color="#053b96"/>
        </linearGradient>
        <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#0a4ebd"/>
        </radialGradient>
        <filter id="drop" x="-12%" y="-12%" width="124%" height="124%">
          <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#041c47" flood-opacity="0.45"/>
        </filter>
      </defs>
      <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bgSquircle)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="url(#ringMetal)" stroke-width="3.6" filter="url(#drop)"/>
      <text x="58" y="57" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-weight="900" font-size="42" fill="url(#syBlue)" stroke="#bae6fd" stroke-width="1" filter="url(#drop)">S</text>
      <circle cx="77" cy="40" r="6.4" fill="url(#dotGrad)" stroke="#bae6fd" stroke-width="0.9" filter="url(#drop)"/>
      <path d="M26 57 C42 57, 54 67, 56 97 C58 76, 72 56, 86 28 C78 52, 66 72, 57 98 C51 77, 39 63, 26 57 Z" fill="url(#syBlue)" stroke="#bae6fd" stroke-width="0.9" stroke-linejoin="round" filter="url(#drop)"/>
      <path d="M57 94 C64 74, 75 56, 85 30" fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    </svg>
    <span>Studio Yaniv</span>
  </div>
  <div class="hdr-tools">
    <div class="seg" id="ratioSeg">
      <button class="btn-pill on" data-r="16:9">16:9</button>
      <button class="btn-pill" data-r="9:16">9:16</button>
      <button class="btn-pill" data-r="1:1">1:1</button>
    </div>
    <button class="btn-dark" id="btnDlHtml" title="הורד קובץ HTML עם המפתחות השמורים">&#11015; קוד</button>
    <button class="btn-dark" id="btnCopyHtml" title="העתק קוד HTML">העתק</button>
    <button class="btn-white" id="btnVault">שמורים (<span id="vCnt">0</span>)</button>
    <button class="btn-dark" id="btnSrvs">שרתים (<span id="sCnt">0</span>)</button>
  </div>
</header>

<main>
  <section class="stage" id="stageBox">
    <div id="emptyPlay" style="width:56px;height:56px;border-radius:50%;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:22px">&#9654;</div>
    <img id="imgView" class="hide" alt="" />
    <video id="vidView" class="hide" playsinline controls></video>
    <div id="renderOverlay">
      <div class="ringWrap">
        <svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg)">
          <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5.5"></circle>
          <circle id="ringArc" cx="38" cy="38" r="30" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"></circle>
        </svg>
        <span class="ringPct" id="pctTxt">5%</span>
      </div>
      <div class="pbar"><i id="pBarFill"></i></div>
      <button class="stopBtn" id="btnStopAll" aria-label="הפסק" title="הפסק">&#9632;</button>
    </div>
  </section>

  <section class="bar">
    <div class="row">
      <button class="icbtn" id="btnMute" title="השתק שמע להורדה ללא סאונד">&#128266; השתק שמע</button>
      <button class="icbtn" id="btnDlNow" disabled>&#11015; הורד</button>
    </div>
    <div class="row">
      <button class="icbtn danger" id="btnClear" disabled>מחק</button>
    </div>
  </section>

  <div id="errBox" class="err hide"><span id="errTxt"></span><button onclick="this.parentElement.classList.add('hide')">&#10005;</button></div>

  <section class="card">
    <div class="pwrap">
      <textarea id="promptBox" rows="2" placeholder="כתוב תיאור מדויק: שינוי על התמונה, הפיכת תמונה לוידאו, דיבור בעברית, או מוזיקה/קולות..."></textarea>
      <button class="ideaMini" id="btnIdea" title="רעיון מפתיע">&#127922;</button>
    </div>
    <div class="grid3">
      <button class="act v" id="btnVid">יצירת וידאו</button>
      <button class="act e" id="btnVidEdit">עריכת וידאו</button>
      <button class="act b" id="btnImgEdit">עריכת תמונה</button>
    </div>
    <div class="grid2">
      <button class="act x" id="btnExtend" disabled>&#9193; הארכת סרטון +6s</button>
      <button class="act n" id="btnAgain" disabled>&#128260; צור שוב</button>
    </div>
  </section>

  <section class="grid2">
    <div class="upWrap">
      <button class="act n" id="btnUpVidMenu">&#127909; העלאת סרטון &#9662;</button>
      <div class="ddMenu" id="vidMenu">
        <button class="ddItem" id="optVidGal">&#128193; גלריה</button>
        <button class="ddItem" id="optVidCam">&#128247; צילום סרטון במצלמה</button>
      </div>
      <input type="file" id="inVid" accept="video/*,.mp4,.mov,.webm" hidden />
      <input type="file" id="inVidCam" accept="video/*" capture="environment" hidden />
    </div>
    <div class="upWrap">
      <button class="act n" id="btnUpImgMenu">&#128444; העלאת תמונה &#9662;</button>
      <div class="ddMenu" id="imgMenu">
        <button class="ddItem" id="optImgGal">&#128193; גלריה</button>
        <button class="ddItem" id="optImgCam">&#128247; צילום תמונה במצלמה</button>
      </div>
      <input type="file" id="inImg" accept="image/*,.heic,.heif,.png,.jpg,.jpeg,.webp" hidden />
      <input type="file" id="inImgCam" accept="image/*" capture="environment" hidden />
    </div>
  </section>
</main>

<div class="modal" id="srvModal" onclick="this.classList.remove('on')">
  <div class="mbox" style="height:88dvh" onclick="event.stopPropagation()">
    <div class="mhead">
      <span>שרתים ומפתחות (מתחלפים ללא הגבלה)</span>
      <div class="row">
        <button class="btn-dark" id="btnTestSrvs" style="padding:4px 9px;font-size:11px">&#128269; בדוק</button>
        <button class="btn-dark" id="btnResetSrvs" style="padding:4px 9px;font-size:11px">&#8635; אפס</button>
        <button onclick="document.getElementById('srvModal').classList.remove('on')">&#10005;</button>
      </div>
    </div>
    <div class="mbody">
      <div class="keyBar">
        <span>&#128273;</span>
        <input id="quickKeyInput" type="text" autocomplete="off" spellcheck="false" placeholder="הדבק מפתח כאן (נשמר אוטומטית): hf_ / sk_ / sk-air- / nvapi- / AIza / gsk_" />
        <button id="btnApplyKey">שמור</button>
        <button class="sec" id="btnTestKey">בדוק מפתח</button>
      </div>
      <div class="keyStat" id="keyStat"></div>
      <div class="keyGrid">
        <input id="kHF" data-k="hf" type="password" placeholder="Hugging Face (hf_... מתחדש יומי)" />
        <input id="kAir" data-k="airforce" type="password" placeholder="Api.Airforce (sk-air-... 1000/יום)" />
        <input id="kLlm7" data-k="llm7" type="password" placeholder="LLM7.io Token (250/שעה וידאו+תמונה)" />
        <input id="kPol" data-k="pollinations" type="password" placeholder="Pollinations Secret (sk_... מ-enter.pollinations.ai)" />
        <input id="kCfTok" data-k="cfToken" type="password" placeholder="Cloudflare Token (~173 FLUX/יום)" />
        <input id="kCfAcc" data-k="cfAccount" type="text" placeholder="Cloudflare Account ID" />
        <input id="kNv" data-k="nvidia" type="password" placeholder="NVIDIA NIM (nvapi-... חינמי קבוע)" />
        <input id="kGem" data-k="gemini" type="password" placeholder="Google Gemini (AIza... תמונה+תרגום)" />
        <input id="kGroq" data-k="groq" type="password" placeholder="Groq (gsk_... מתחדש יומי)" />
        <input id="kHorde" data-k="horde" type="text" placeholder="AI Horde Key (ברירת מחדל: 0000000000)" />
      </div>
      <div id="srvList" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>
  </div>
</div>

<div class="modal" id="vaultModal" onclick="this.classList.remove('on')">
  <div class="mbox" style="height:88dvh" onclick="event.stopPropagation()">
    <div class="mhead"><span>תיקיית השמורים</span><button onclick="document.getElementById('vaultModal').classList.remove('on')">&#10005;</button></div>
    <div class="mbody" id="vaultList"></div>
  </div>
</div>

<div class="modal" id="camModal">
  <div class="mbox" onclick="event.stopPropagation()">
    <div class="mhead"><span id="camTitle">&#128247; מצלמה</span><button id="btnCloseCam">&#10005;</button></div>
    <div class="mbody">
      <video id="camView" autoplay muted playsinline></video>
      <div class="row" style="justify-content:center">
        <button class="act b" id="btnSnap" style="display:none;flex:1">&#128248; צלם תמונה</button>
        <button class="act x" id="btnRecStart" style="display:none;flex:1">&#9210; התחל הקלטה</button>
        <button class="act v" id="btnRecStop" style="display:none;flex:1">&#9209; עצור ושמור</button>
      </div>
    </div>
  </div>
</div>

<script>
/* VERIFIED HIGH-TOKEN, UNLIMITED & ROTATING SERVERS */
const SERVERS = [

function loadSavedKeys(){
  let out = {};
  try { const emb = document.getElementById('embeddedKeys')?.textContent?.trim(); if(emb) Object.assign(out, JSON.parse(emb)); } catch {}
  try { const hm = location.hash.match(/keys=([^&]+)/); if(hm) Object.assign(out, JSON.parse(decodeURIComponent(escape(atob(hm[1]))))); } catch {}
  try { if(typeof window.name === 'string' && window.name.startsWith('SY_KEYS:')) Object.assign(out, JSON.parse(window.name.slice(8))); } catch {}
  try { const ls = localStorage.getItem('studio_yaniv_keys_v2'); if(ls) Object.assign(out, JSON.parse(ls)); } catch {}
  return out;
}

const KEY_FIELDS = [['hf','kHF'],['airforce','kAir'],['llm7','kLlm7'],['pollinations','kPol'],['cfToken','kCfTok'],['cfAccount','kCfAcc'],['nvidia','kNv'],['gemini','kGem'],['groq','kGroq'],['horde','kHorde']];
const KEY_LABELS = {hf:'Hugging Face',airforce:'Api.Airforce',llm7:'LLM7.io',pollinations:'Pollinations',cfToken:'Cloudflare',nvidia:'NVIDIA NIM',gemini:'Google Gemini',groq:'Groq',horde:'AI Horde'};

function getKey(p){ return (st.keys[p] || '').trim(); }
function detectProvider(k){
  if(k.startsWith('hf_')) return 'hf';
  if(k.startsWith('sk-air-')) return 'airforce';
  if(k.startsWith('pk_') || k.startsWith('sk_')) return 'pollinations';
  if(k.startsWith('nvapi-')) return 'nvidia';
  if(k.startsWith('AIza')) return 'gemini';
  if(k.startsWith('gsk_')) return 'groq';
  if(k === '0000000000' || /^[a-zA-Z0-9_-]{22}$/.test(k)) return 'horde';
  return 'llm7';
}

function refreshKeyInputs(){
  KEY_FIELDS.forEach(([k,id])=>{
    const el = $(id), val = st.keys[k] || '';
    el.value = val;
    el.classList.toggle('hasVal', !!val.trim());
  });
  const pol = getKey('pollinations');
  const active = Object.entries(KEY_LABELS).filter(([k])=>getKey(k)).map(([,lbl])=>lbl);
  const elStat = $('keyStat');
  if(pol && pol.startsWith('pk_')){
    elStat.className = 'keyStat warn';
    elStat.textContent = '⚠️ מפתח pk_ של Pollinations חסום מאז 11/2026 ומחזיר 401 — יש להזין מפתח sk_ מ-enter.pollinations.ai.';
  } else {
    elStat.className = 'keyStat';
    const contentTip = (location.protocol==='content:' || location.protocol==='file:') ? ' · לשמירה קבועה באנדרואיד לחץ "↓ קוד"' : '';
    elStat.textContent = active.length
      ? ('✓ נשמר ומופעל: ' + active.join(' · ') + contentTip)
      : '💡 פועל חינמית על Spaces / AI Horde · הדבק מפתח להאצה' + contentTip;
  }
}

function persistKeys(){
  const clean = {};
  Object.entries(st.keys).forEach(([k,v])=>{ if(v && String(v).trim()) clean[k] = String(v).trim(); });
  st.keys = clean;
  st.hfRouterBlocked = false;
  const json = JSON.stringify(clean);
  try { $('embeddedKeys').textContent = json; } catch {}
  try { localStorage.setItem('studio_yaniv_keys_v2', json); } catch {}
  try { window.name = 'SY_KEYS:' + json; } catch {}
  try { history.replaceState(null, '', '#keys=' + btoa(unescape(encodeURIComponent(json)))); } catch {}
  st.cd = {}; st.errMsg = {};
  refreshKeyInputs();
  updateUi();
  if($('srvModal').classList.contains('on')) renderSrvList();
}

function applyQuickKey(rawVal){
  const v = (rawVal || '').trim();
  if(!v) return null;
  const prov = detectProvider(v);
  st.keys[prov] = v;
  persistKeys();
  return { prov, label: KEY_LABELS[prov] || prov };
}

        else msgs.push('✓ HF תקין מלא ('+(j.name||'user')+')');
      } else msgs.push('❌ HF HTTP '+r.status);
    }catch{ msgs.push('⚠️ HF שגיאת רשת'); }
  }
  if(getKey('pollinations')){
    const pk = getKey('pollinations');
    if(pk.startsWith('pk_')) msgs.push('❌ Pollinations pk_ חסום (נדרש sk_)');
    else {
      try{
        const r = await fetch('https://gen.pollinations.ai/v1/models',{headers:{'Authorization':'Bearer '+pk}});
        msgs.push(r.ok ? '✓ Pollinations sk_ תקין' : ('❌ Pollinations HTTP '+r.status));
      }catch{ msgs.push('⚠️ Pollinations שגיאת רשת'); }
    }
  }
  if(getKey('llm7')){
    try{
      const r = await fetch('https://api.llm7.io/v1/models',{headers:{'Authorization':'Bearer '+getKey('llm7')}});
      msgs.push(r.ok ? '✓ LLM7 תקין' : ('❌ LLM7 HTTP '+r.status));
    }catch{ msgs.push('⚠️ LLM7 שגיאת רשת'); }
  }
  if(getKey('gemini')){
    try{
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(getKey('gemini')));
      msgs.push(r.ok ? '✓ Gemini תקין' : ('❌ Gemini HTTP '+r.status));
    }catch{ msgs.push('⚠️ Gemini שגיאת רשת'); }
  }
  if(!msgs.length) msgs.push('הדבק מפתח קודם כדי לבדוק אותו');
  $('keyStat').className = msgs.some(m=>m.startsWith('❌')) ? 'keyStat warn' : 'keyStat';
  $('keyStat').textContent = msgs.join(' · ');
  $('btnTestKey').textContent = 'בדוק מפתח';
};

function renderSrvList(){

    const isLast = activeIds.has(s.id) && !coolLeft, ping = st.pingMap[s.id], lastErr = st.errMsg[s.id];
    const rowCls = coolLeft ? 'srvRow cool' : (isLast ? 'srvRow pin' : 'srvRow ok');
    const stCls = coolLeft ? 'srvSt cool' : 'srvSt ok';
    const stTxt = coolLeft ? `⏳ ${lastErr ? lastErr.slice(0,22) : 'ממתין'} (${coolLeft} דק׳)` : isLast ? '🟢 פעל בהצלחה' : ping===false ? '⚠️ עמוס' : isUnlimited(s) ? '♾️ ללא הגבלה' : '🟢 זמין ברוטציה';

}

function hasReadyKey(s){
  if(s.host==='router.huggingface.co') return !!getKey('hf') && !st.hfRouterBlocked;
  if(s.host==='api.llm7.io' && s.cat!=='llm') return !!getKey('llm7');
  if(s.host==='api.airforce') return !!getKey('airforce');
  if(s.host==='api.cloudflare.com') return !!(getKey('cfToken') && getKey('cfAccount'));
  if(s.host==='ai.api.nvidia.com') return !!getKey('nvidia');
  if(s.host==='generativelanguage.googleapis.com') return !!getKey('gemini');
  if(s.id==='vid-pollinations' || s.id==='aud-pollinations') return getKey('pollinations').startsWith('sk_');
  if(s.host==='gen.pollinations.ai'){
    const pk = getKey('pollinations');
    return pk.startsWith('sk_');
  }
  return true;
}

function rotated(cat){
  const now = Date.now();
  let arr = SERVERS.filter(s => s.cat===cat && hasReadyKey(s) && (!st.cd[s.id] || st.cd[s.id]<=now));
  if(!arr.length) arr = SERVERS.filter(s => s.cat===cat && hasReadyKey(s));
  const idx = st.rot[cat] || 0;
  st.rot[cat] = idx + 1;
  const proven = arr.filter(s => (st.perf[s.id]?.ok||0) > 0 && !(st.perf[s.id]?.fail||0));
  const fresh = arr.filter(s => !st.perf[s.id] || (!(st.perf[s.id]?.fail||0) && !(st.perf[s.id]?.ok||0)));
  const deg = arr.filter(s => (st.perf[s.id]?.fail||0) > 0);
  const rotA = a => a.length<=1 ? a : [...a.slice(idx%a.length), ...a.slice(0,idx%a.length)];
  const list = [...rotA(proven), ...rotA(fresh), ...rotA(deg)];
  const prevId = st.lastUsed[cat];
  if(prevId && list.length > 1 && list[0]?.id === prevId) list.push(list.shift());
  return list;
}

async function buildExactPrompt(txt, mode, sig){
  const clean = txt.trim(), isEdit = mode==='edit', isI2V = mode==='i2v', isT2V = mode==='t2v';
  let en = clean;
  if(/[\u0590-\u05FF]/.test(clean)){
    const rule = isEdit
      ? 'Convert this Hebrew photo edit into an exact literal English editing instruction. Explicitly preserve all original people, faces, poses, outfits, and untouched background identical: '
      : isI2V
      ? 'Convert this Hebrew image-to-video request into an exact literal English video motion prompt. Keep the exact same people, faces, clothing, and background from the reference photo while performing the requested action: '
      : isT2V
      ? 'Translate this Hebrew video request literally into vivid English describing clear dynamic subject motion and exact scene details: '
      : mode==='sfx'
      ? 'Translate this Hebrew sound effect / audio scene description into concise English sound description: '
      : 'Translate this Hebrew image request literally into clear accurate English keeping 100% of every requested detail: ';
    const llmOut = await callFreeLLM(rule + clean + ' (Output ONLY English, no quotes)', sig);
    if(llmOut) en = llmOut;
    else {
      try{
        const mr = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(clean)+'&langpair=he|en',{signal:sig});
        const mj = await mr.json(); const c = mj?.responseData?.translatedText;
        if(c && !/[\u0590-\u05FF]/.test(c)) en = c;
      }catch{}
    }
  }
  if(isEdit && !/preserve|identical|unchanged/i.test(en)) en += '. Strictly preserve all original faces, people, proportions, and unmodified background identical.';
  if(isI2V && !/same people|preserve|reference/i.test(en)) en += '. Keep the exact same people, faces, clothing, and background from the reference image while animating natural lively motion.';
  return en;
}

async function callGradio(host, pref, ep, data, sig, timeoutMs=45000){
  const hf = getKey('hf'), c = new AbortController(), t = setTimeout(()=>c.abort(), timeoutMs);
  const onAb = () => c.abort();
  sig?.addEventListener('abort', onAb, {once:true});
  const base = 'https://'+host+pref+'/call/'+ep;
  const authHdr = hf ? {'Authorization':'Bearer '+hf} : {};
  try{
    let pr;
    try { pr = await fetch(base,{method:'POST',headers:{'Content-Type':'application/json',...authHdr},body:JSON.stringify({data}),signal:c.signal}); }
    catch { pr = await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data}),signal:c.signal}); }
    if(!pr.ok) throw new Error('Call HTTP '+pr.status);
    const pj = await pr.json();
    const event_id = pj?.event_id;
    if(!event_id) throw new Error('No event_id');
    let sr;
    try { sr = await fetch(base+'/'+event_id, {signal:c.signal, headers:authHdr}); }
    catch { sr = await fetch(base+'/'+event_id, {signal:c.signal}); }
    if(!sr.ok) throw new Error('Stream HTTP '+sr.status);
    const txt = await sr.text(), lines = txt.split('\n');
    for(let i=0;i<lines.length;i++){
      if(lines[i].startsWith('event: error')){
        const d = (lines[i+1]||'').replace(/^data:\s*/,'').trim();
        const isQ = /quota|limit|exceeded|zerogpu|sign in|login/i.test(d);
        throw new Error(isQ ? ('ZeroGPU: '+d.slice(0,45)) : ('Space: '+(d==='null'?'Runtime error':d.slice(0,55))));
      }
      if(lines[i].startsWith('event: complete')){ const d=lines[i+1]?.replace(/^data:\s*/,''); if(d) return JSON.parse(d); }
    }
    throw new Error('No complete event');
  }finally{ clearTimeout(t); sig?.removeEventListener('abort', onAb); }
}

function extractUrlFromVal(it, host, pref){
  if(!it) return null;
  if(typeof it==='string' && (it.startsWith('http')||it.startsWith('data:'))) return it;
  if(it.url) return it.url;
  if(it.path && host) return 'https://'+host+pref+'/file='+encodeURIComponent(it.path);
  if(it.video) return extractUrlFromVal(it.video, host, pref);
  if(it.image) return extractUrlFromVal(it.image, host, pref);
  if(it.audio) return extractUrlFromVal(it.audio, host, pref);
  if(it.value) return extractUrlFromVal(it.value, host, pref);
  if(Array.isArray(it)){
    for(const sub of it){ const u = extractUrlFromVal(sub, host, pref); if(u) return u; }
  }
  return null;
}
function findUrl(res, host, pref){
  for(const it of res||[]){ const u = extractUrlFromVal(it, host, pref); if(u) return u; }
  return null;
}

async function verifyVideoMotion(blob){
  const u = URL.createObjectURL(blob);
  try{
    const v = document.createElement('video'); v.muted=true; v.src=u;
    await new Promise((res,rej)=>{ const t=setTimeout(()=>rej(),4000); v.onloadedmetadata=()=>{clearTimeout(t);res();}; });
    if(!Number.isFinite(v.duration)||v.duration<0.8) return false;
    const c=document.createElement('canvas'); c.width=48; c.height=48; const ctx=c.getContext('2d');
    v.currentTime=Math.min(0.2,v.duration*0.1); await new Promise(r=>v.onseeked=r); ctx.drawImage(v,0,0,48,48);
    const d1=ctx.getImageData(0,0,48,48).data;
    v.currentTime=Math.max(0.4,v.duration*0.78); await new Promise(r=>v.onseeked=r); ctx.drawImage(v,0,0,48,48);
    const d2=ctx.getImageData(0,0,48,48).data;
    let diff=0; for(let i=0;i<d1.length;i+=4) diff+=Math.abs(d1[i]-d2[i])+Math.abs(d1[i+1]-d2[i+1])+Math.abs(d1[i+2]-d2[i+2]);
    return (diff/(48*48*3)) > 1.1;
  }catch{ return true; }
  finally{ URL.revokeObjectURL(u); }
}

async function blobToBase64(blob){
  return await new Promise(res => { const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}

async function blobToHordeWebp(blob){
  const img = new Image(), u = URL.createObjectURL(blob);
  img.src = u; await new Promise(r => img.onload = r);
  const w0 = img.naturalWidth||512, h0 = img.naturalHeight||512, sc = Math.min(1, 512/Math.max(w0,h0));
  const w = Math.max(256, Math.round((w0*sc)/64)*64), h = Math.max(256, Math.round((h0*sc)/64)*64);
  const c = document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(u);
  return { w, h, b64: c.toDataURL('image/webp',0.88).split(',')[1] };
}

async function raceServers(cat, fn, batch=2, sig){
  let rem = rotated(cat);
  const reasons = [];
  while(rem.length>0){
    if(sig.aborted) throw new Error('Aborted');
    const b = rem.slice(0, batch); rem = rem.slice(batch);
    const cs = b.map(()=>new AbortController());
    const onAb = () => cs.forEach(c=>c.abort());
    sig.addEventListener('abort', onAb, {once:true});
    try{
      const won = await Promise.any(b.map(async (s,j)=>{
        try{
          const res = await fn(s, cs[j].signal);
          cs.forEach((x,k)=>{if(k!==j)x.abort();});
          st.perf[s.id]={ok:(st.perf[s.id]?.ok||0)+1,fail:0};
          st.lastUsed[cat] = s.id;
          delete st.errMsg[s.id];
          return {res, s};
        }
        catch(e){
          const msg = String(e?.message || 'Error');
          st.perf[s.id]={ok:st.perf[s.id]?.ok||0,fail:(st.perf[s.id]?.fail||0)+1};
          st.cd[s.id] = Date.now() + (s.ref||4)*60000;
          st.errMsg[s.id] = msg;
          reasons.push(`${s.name.split(' (')[0]}: ${msg}`);
          throw e;
        }
      }));
      sig.removeEventListener('abort', onAb);
      return won;
    }catch{
      sig.removeEventListener('abort', onAb);
      if(sig.aborted) throw new Error('Aborted');
    }
  }
  const sampleErr = reasons.slice(0,4).join(' | ');
  throw new Error('כל השרתים בקטגוריה נכשלו כרגע. פתח "שרתים" לבדיקת מפתח/סטטוס. (' + sampleErr + ')');
}

async function extractSpokenHebrew(raw, sig){
  const qm = raw.match(/["'״׳]([^"'״׳]{2,140})["'״׳]/);
  if(qm) return qm[1].trim();
  const am = raw.match(/(?:אומר|אומרת|אומרים|תגיד|שיגיד|יגיד|תאמר|לומר|להגיד|says?|saying)\s+(?:ש)?(.{2,120})/i);
  if(am?.[1]) return am[1].replace(/\s*(בלי מוזיקה|ללא מוזיקה).*$/i,'').trim();
  const isHe = /[\u0590-\u05FF]/.test(raw);
  const generated = await callFreeLLM((isHe?'כתוב אך ורק משפט דיבור קצר וטבעי בעברית (בלי מרכאות וללא הסברים) שהדמות אומרת לפי ההנחיה: ':'Write ONLY 1 short natural spoken sentence matching: ')+raw, sig);
  if(generated) return generated.replace(/^["'״׳]+|["'״׳]+$/g,'').trim();
  return raw.replace(/(תעשה ש|תגרום ל|שידבר|תדבר|דיבור|דיבוב|בקול|בוידאו|וידאו|סרטון|בלי מוזיקה|ללא מוזיקה)/gi,'').trim() || (isHe ? 'שלום לכולם!' : 'Hello!');
}

async function generateRequestedAudioOnly(raw, sig){
  const wantsNoSound = st.muted || /(ללא שמע|בלי סאונד|בלי קול|muted|silent)/i.test(raw);
  if(wantsNoSound) return { speechBlob:null, musicBlob:null, wantsSpeech:false, wantsMusic:false, wantsSfx:false };
  const wantsNoMusic = /(בלי מוזיקה|ללא מוזיקה|without music|no music)/i.test(raw);
  const wantsMusic = !wantsNoMusic && /(מוזיקה|מוסיקה|מנגינה|שיר|פסקול|music|song|melody|beat|soundtrack)/i.test(raw);
  const wantsSpeech = /(מדבר|מדברת|מדברים|לדבר|דיבר|שידבר|תדבר|אומר|אומרת|אומרים|תגיד|שיגיד|יגיד|דיבור|דיבוב|דובב|לספר|בדיחה|נאום|קריינות|talk|speak|speech|say|dialogue|lip)/i.test(raw) || /["'״׳][^"'״׳]{2,140}["'״׳]/.test(raw);
  const wantsSfx = !wantsSpeech && !wantsMusic && /(צוחק|צוחקת|צוחקים|צחוק|בכי|בוכה|נובח|נביחה|גשם|רעם|רוח|גלים|ים|אש|מנוע|רכב|מטוס|דלת|צליל|קולות|סאונד|laugh|cry|bark|rain|thunder|wind|ocean|fire|engine|sfx|sound)/i.test(raw);

  let speechBlob = null, musicBlob = null;
  if(wantsSpeech){
    const line = await extractSpokenHebrew(raw, sig);
    const ttsPool = rotated('audio');
    const ordered = /[\u0590-\u05FF]/.test(line)
      ? [...ttsPool.filter(x=>x.id==='aud-phonikud'||x.id.startsWith('aud-edge')), ...ttsPool.filter(x=>x.id!=='aud-phonikud'&&!x.id.startsWith('aud-edge'))]
      : ttsPool;
    for(const s of ordered){ try{ speechBlob = await dynCall(s, line, null, sig); if(speechBlob) break; }catch{} }
    if(!speechBlob) throw new Error('שרתי הדיבור עמוסים כרגע, נסה שוב בעוד רגע.');
  }
  if(wantsMusic){
    const enMus = await buildExactPrompt(raw, 'music', sig);
    try{ musicBlob = (await raceServers('music',(s,sg)=>dynCall(s,enMus,null,sg),2,sig)).res; }catch{}
  }
  return { speechBlob, musicBlob, wantsSpeech, wantsMusic, wantsSfx };
}

async function attachMatchedSfx(vidBlob, rawPrompt, sig){
  if(st.muted) return vidBlob;
  const enSfx = await buildExactPrompt(rawPrompt, 'sfx', sig);
  try{
    const mma = SERVERS.find(s=>s.id==='sfx-mmaudio');
    if(mma && (!st.cd[mma.id] || st.cd[mma.id]<=Date.now())){
      const withAud = await dynCall(mma, enSfx, null, sig, null, vidBlob);
      if(withAud) return withAud;
    }
  }catch{}
  try{
    const sfxAud = (await raceServers('sfx',(s,sg)=>s.id!=='sfx-mmaudio'?dynCall(s,enSfx,null,sg):Promise.reject(),2,sig)).res;
    if(sfxAud) return await muxOrStripVideo(URL.createObjectURL(vidBlob), sfxAud, false, false, false);
  }catch{}
  return vidBlob;
}

async function muxOrStripVideo(vUrl, aBlob, keepOrig=false, strip=false, loopAud=false, maxSec=0){
  const v=document.createElement('video'); v.crossOrigin='anonymous'; v.muted=!keepOrig||strip; v.src=vUrl;
  await new Promise(r=>v.onloadedmetadata=r);
  const c=document.createElement('canvas'); c.width=(v.videoWidth||1024)&~1; c.height=(v.videoHeight||576)&~1;
  const ctx=c.getContext('2d');
  let tracks=[...c.captureStream(24).getVideoTracks()], actx=null, srcNode=null;
  if(!strip && aBlob){
    actx=new AudioContext(); await actx.resume().catch(()=>{});
    const ab=await actx.decodeAudioData(await aBlob.arrayBuffer());
    srcNode=actx.createBufferSource(); srcNode.buffer=ab; srcNode.loop=loopAud && ab.duration<(v.duration||6);
    const dest=actx.createMediaStreamDestination(); srcNode.connect(dest);
    if(keepOrig){ try{ const es=actx.createMediaElementSource(v); es.connect(dest); }catch{} }
    tracks.push(...dest.stream.getAudioTracks());
  }
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:'video/webm'});
  const ch=[]; rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const done=new Promise(res=>rec.onstop=()=>{try{srcNode?.stop()}catch{} actx?.close().catch(()=>{}); res(new Blob(ch,{type:'video/webm'}));});
  rec.start(); srcNode?.start(0); await v.play();
  (function d(){ if(v.ended||v.paused||(maxSec>0&&v.currentTime>=maxSec)){v.pause();rec.stop();return;} ctx.drawImage(v,0,0,c.width,c.height); requestAnimationFrame(d); })();
  return await done;
}

async function concatTwoVideos(urlA, urlB, keepAudio=true, maxSec=0){
  const vA=document.createElement('video'); vA.crossOrigin='anonymous'; vA.muted=!keepAudio; vA.src=urlA;
  const vB=document.createElement('video'); vB.crossOrigin='anonymous'; vB.muted=!keepAudio; vB.src=urlB;
  await Promise.all([new Promise(r=>vA.onloadedmetadata=r), new Promise(r=>vB.onloadedmetadata=r)]);
  const cw=(vA.videoWidth||1024)&~1, ch=(vA.videoHeight||576)&~1;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const ctx=c.getContext('2d');
  let tracks=[...c.captureStream(24).getVideoTracks()], actx=null;
  if(keepAudio){
    try{
      actx=new AudioContext(); await actx.resume().catch(()=>{});
      const dest=actx.createMediaStreamDestination();
      try{ actx.createMediaElementSource(vA).connect(dest); }catch{}
      try{ actx.createMediaElementSource(vB).connect(dest); }catch{}
      tracks.push(...dest.stream.getAudioTracks());
    }catch{}
  }
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:'video/webm'}), chs=[];
  rec.ondataavailable=e=>{if(e.data.size)chs.push(e.data)};
  const done=new Promise(res=>rec.onstop=()=>{actx?.close().catch(()=>{}); res(new Blob(chs,{type:'video/webm'}));});
  rec.start();
  const tStart = performance.now();
  for(const v of [vA, vB]){
    if(maxSec>0 && ((performance.now()-tStart)/1000)>=maxSec) break;
    await v.play();
    await new Promise(res=>{
      function step(){
        const elapsed=(performance.now()-tStart)/1000;
        if(v.ended||v.paused||(maxSec>0&&elapsed>=maxSec)){v.pause();res();return;}
        const sc=Math.min(cw/(v.videoWidth||cw),ch/(v.videoHeight||ch)), dw=(v.videoWidth||cw)*sc, dh=(v.videoHeight||ch)*sc;
        ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(v,(cw-dw)/2,(ch-dh)/2,dw,dh);
        requestAnimationFrame(step);
      }
      step();
    });
  }
  rec.stop();
  return await done;
}

async function captureVidFrame(url, atEnd=false){
  const v=document.createElement('video'); v.crossOrigin='anonymous'; v.src=url;
  await new Promise(r=>v.onloadedmetadata=r);
  v.currentTime=atEnd?Math.max(0,(v.duration||1)-.05):.05;
  await new Promise(r=>v.onseeked=r);
  const c=document.createElement('canvas'); c.width=v.videoWidth||1024; c.height=v.videoHeight||576;
  c.getContext('2d').drawImage(v,0,0);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}
async function getVidDuration(blob){
  const u=URL.createObjectURL(blob), v=document.createElement('video'); v.preload='metadata'; v.src=u;
  const d = await new Promise(r=>{const t=setTimeout(()=>r(5),2000); v.onloadedmetadata=()=>{clearTimeout(t);r(v.duration||5);}; v.onerror=()=>{clearTimeout(t);r(5);};});
  URL.revokeObjectURL(u); return d;
}

async function ensure6to10Sec(firstBlob, enPrompt, raw, sig, capMax10=true){
  let curBlob = firstBlob;
  let dur = await getVidDuration(curBlob);
  if(dur < 5.8){
    setRenderPct(84);
    const lf = await captureVidFrame(URL.createObjectURL(curBlob), true);
    try{
      const contBlob = (await raceServers('video',(s,sg)=>dynCall(s,`${enPrompt}. Seamless direct continuation from final frame keeping exact same people, faces, clothing, and background.`,lf,sg),2,sig)).res;
      curBlob = await concatTwoVideos(URL.createObjectURL(curBlob), URL.createObjectURL(contBlob), !st.muted, capMax10 ? 10 : 0);
      dur = await getVidDuration(curBlob);
    }catch{}
  }
  if(capMax10 && dur > 10.2){
    curBlob = await muxOrStripVideo(URL.createObjectURL(curBlob), null, !st.muted, st.muted, false, 10.0);
  }
  return curBlob;
}

function showImg(b){
  st.type='image'; st.imgUrl=URL.createObjectURL(b); $('imgView').src=st.imgUrl;
  $('imgView').onload=()=>{ if($('imgView').naturalWidth) $('stageBox').style.aspectRatio=$('imgView').naturalWidth+'/'+$('imgView').naturalHeight; };
  st.vault.unshift({type:'image',url:st.imgUrl,blob:b}); updateUi();
}
function showVid(b){
  st.type='video'; st.vidBlob=b; st.vidUrl=URL.createObjectURL(b); $('vidView').src=st.vidUrl;
  $('vidView').onloadedmetadata=()=>{ if($('vidView').videoWidth) $('stageBox').style.aspectRatio=$('vidView').videoWidth+'/'+$('vidView').videoHeight; };
  $('vidView').play().catch(()=>{}); st.vault.unshift({type:'video',url:st.vidUrl,blob:b}); updateUi();
}

// 1) עריכת / יצירת תמונה
$('btnImgEdit').onclick = async () => {
  const raw = $('promptBox').value.trim(); if(!raw) return setErr('יש לכתוב תיאור עריכה או יצירת תמונה.');
  st.lastAction = 'imgEdit'; setErr(''); st.ctrl = new AbortController(); startRender(10);
  try{
    const wantsNew = /(תמונה חדשה|צור תמונה מאפס|בלי התמונה|new image)/i.test(raw);
    const srcBlob = (!wantsNew && st.type==='image') ? await (await fetch(st.imgUrl)).blob()
                  : (!wantsNew && st.type==='video') ? await captureVidFrame(st.vidUrl, false) : null;
    if(srcBlob){
      const en = await buildExactPrompt(raw, 'edit', st.ctrl.signal);
      const {res} = await raceServers('edit',(s,sig)=>dynCall(s,en,srcBlob,sig),2,st.ctrl.signal);
      setRenderPct(100); showImg(res);
    } else {
      const en = await buildExactPrompt(raw, 't2i', st.ctrl.signal);
      const {res} = await raceServers('image',(s,sig)=>dynCall(s,en,null,sig),2,st.ctrl.signal);
      setRenderPct(100); showImg(res);
    }
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 2) יצירת וידאו (6 עד 10 שניות + שמע צמוד)
$('btnVid').onclick = async () => {
  const raw = $('promptBox').value.trim();
  const wantsNewVid = /(סרטון חדש|בלי התמונה|new video)/i.test(raw);
  const refBlob = (!wantsNewVid && st.type==='image') ? await (await fetch(st.imgUrl)).blob() : null;
  if(!raw && !refBlob) return setErr('יש לכתוב תיאור לסרטון או להעלות תמונה (או שניהם יחד).');
  st.lastAction = 'vid'; setErr(''); st.ctrl = new AbortController(); startRender(36);
  try{
    const { speechBlob, wantsSpeech, wantsMusic, musicBlob, wantsSfx } = raw ? await generateRequestedAudioOnly(raw, st.ctrl.signal) : {};
    const en = await buildExactPrompt(raw||'lively natural motion', refBlob?'i2v':'t2v', st.ctrl.signal);

    let vb;
    if(refBlob && speechBlob){
      try{ vb = (await raceServers('lipsync',(s,sig)=>dynCall(s,en,refBlob,sig,speechBlob),2,st.ctrl.signal)).res; }
      catch(e){ if(st.ctrl.signal.aborted) throw e; }
    }
    if(!vb){
      try{ vb = (await raceServers('video',(s,sig)=>dynCall(s,en,refBlob,sig),2,st.ctrl.signal)).res; }
      catch(e){
        if(st.ctrl.signal.aborted || refBlob) throw e;
        const kf = (await raceServers('image',(s,sig)=>dynCall(s,en,null,sig),2,st.ctrl.signal)).res;
        vb = (await raceServers('video',(s,sig)=>dynCall(s,en,kf,sig),2,st.ctrl.signal)).res;
      }
    }

    vb = await ensure6to10Sec(vb, en, raw, st.ctrl.signal, true);
    const aud = speechBlob || (wantsMusic ? musicBlob : null);
    if(aud && !(refBlob && speechBlob)) vb = await muxOrStripVideo(URL.createObjectURL(vb), aud, false, false, !wantsSpeech);
    else if(wantsSfx && raw) vb = await attachMatchedSfx(vb, raw, st.ctrl.signal);
    setRenderPct(100); showVid(vb);
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 3) עריכת וידאו (6 עד 10 שניות + שמע צמוד)
$('btnVidEdit').onclick = async () => {
  const raw = $('promptBox').value.trim(); if(!raw) return setErr('יש לתאר בטקסט מה לערוך בסרטון.');
  if(!st.type) return setErr('יש להעלות סרטון או תמונה תחילה.');
  st.lastAction = 'vidEdit'; setErr(''); st.ctrl = new AbortController(); startRender(36);
  try{
    const { speechBlob, musicBlob, wantsSpeech, wantsMusic, wantsSfx } = await generateRequestedAudioOnly(raw, st.ctrl.signal);
    const stripped = raw.replace(/["'״׳][^"'״׳]*["'״׳]/g,' ').replace(/(?:אומר|אומרת|תגיד|שיגיד|מדבר|לדבר)\s+(?:ש|את|על)\s+.+$/i,' ');
    const hasVisualEdit = /(משקפיים|כובע|שלג|רקע|חולצה|החלף|תוריד|שנה|צבע|יער|ים|עיר|אש|גשם|שמיים|sunglasses|hat|snow|background|shirt|replace|change|remove)/i.test(stripped);
    const frameBlob = st.type==='video' ? await captureVidFrame(st.vidUrl, false) : await (await fetch(st.imgUrl)).blob();

    if((wantsSpeech || wantsMusic || wantsSfx) && !hasVisualEdit){
      if(wantsSpeech && speechBlob){
        try{
          const enSp = await buildExactPrompt(raw, 'i2v', st.ctrl.signal);
          let lipV = (await raceServers('lipsync',(s,sig)=>dynCall(s,enSp,frameBlob,sig,speechBlob),2,st.ctrl.signal)).res;
          lipV = await ensure6to10Sec(lipV, enSp, raw, st.ctrl.signal, true);
          setRenderPct(100); showVid(lipV); return;
        }catch(e){ if(st.ctrl.signal.aborted) throw e; }
      }
      if(st.type==='video'){
        let out = st.vidBlob;
        if(speechBlob || musicBlob) out = await muxOrStripVideo(st.vidUrl, speechBlob||musicBlob, !st.muted, false, wantsMusic && !wantsSpeech);
        else if(wantsSfx) out = await attachMatchedSfx(st.vidBlob, raw, st.ctrl.signal);
        setRenderPct(100); showVid(out); return;
      }
    }

    const enEdit = await buildExactPrompt(raw, 'edit', st.ctrl.signal);
    const editedImg = (await raceServers('edit',(s,sig)=>dynCall(s,enEdit,frameBlob,sig),2,st.ctrl.signal)).res;
    const enVid = await buildExactPrompt(raw, 'i2v', st.ctrl.signal);
    let vidBlob = null;
    if(wantsSpeech && speechBlob){
      try{ vidBlob = (await raceServers('lipsync',(s,sig)=>dynCall(s,enEdit,editedImg,sig,speechBlob),2,st.ctrl.signal)).res; }
      catch(e){ if(st.ctrl.signal.aborted) throw e; }
    }
    if(!vidBlob) vidBlob = (await raceServers('video',(s,sig)=>dynCall(s,enVid,editedImg,sig),2,st.ctrl.signal)).res;
    vidBlob = await ensure6to10Sec(vidBlob, enVid, raw, st.ctrl.signal, true);
    const aud = speechBlob || (wantsMusic ? musicBlob : null);
    if(aud && !(wantsSpeech && speechBlob)) vidBlob = await muxOrStripVideo(URL.createObjectURL(vidBlob), aud, false, false, !wantsSpeech);
    else if(wantsSfx) vidBlob = await attachMatchedSfx(vidBlob, raw, st.ctrl.signal);
    setRenderPct(100); showVid(vidBlob);
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 4) הארכת סרטון ללא הגבלה (+6s בכל לחיצה)
$('btnExtend').onclick = async () => {
  if(!st.type) return setErr('יש להעלות או ליצור סרטון/תמונה תחילה.');
  st.lastAction = 'extend'; setErr(''); st.ctrl = new AbortController(); startRender(36);
  try{
    const raw = $('promptBox').value.trim() || 'המשך טבעי וחלק עם אותם פנים ורקע';
    const lastFrame = st.type==='video' ? await captureVidFrame(st.vidUrl, true) : await (await fetch(st.imgUrl)).blob();
    const { speechBlob, musicBlob, wantsSpeech, wantsMusic, wantsSfx } = await generateRequestedAudioOnly(raw, st.ctrl.signal);
    const en = await buildExactPrompt(raw, 'i2v', st.ctrl.signal);

    let extBlob = null;
    if(speechBlob){
      try{ extBlob = (await raceServers('lipsync',(s,sig)=>dynCall(s,en,lastFrame,sig,speechBlob),2,st.ctrl.signal)).res; }
      catch(e){ if(st.ctrl.signal.aborted) throw e; }
    }
    if(!extBlob){
      extBlob = (await raceServers('video',(s,sig)=>dynCall(s,en,lastFrame,sig),2,st.ctrl.signal)).res;
      extBlob = await ensure6to10Sec(extBlob, en, raw, st.ctrl.signal, false);
      const aud = speechBlob || (wantsMusic ? musicBlob : null);
      if(aud) extBlob = await muxOrStripVideo(URL.createObjectURL(extBlob), aud, false, false, !wantsSpeech);
      else if(wantsSfx) extBlob = await attachMatchedSfx(extBlob, raw, st.ctrl.signal);
    }

    if(st.type==='video'){
      const merged = await concatTwoVideos(st.vidUrl, URL.createObjectURL(extBlob), !st.muted, 0);
      setRenderPct(100); showVid(merged);
    } else {
      setRenderPct(100); showVid(extBlob);
    }
  }catch(e){ if(!st.ctrl.signal.aborted) setErr(e.message||'שגיאה'); }
  finally{ stopRender(); updateUi(); }
};

// 5) צור שוב
$('btnAgain').onclick = () => {
  if(st.lastAction==='vid') $('btnVid').click();
  else if(st.lastAction==='vidEdit') $('btnVidEdit').click();
  else if(st.lastAction==='imgEdit') $('btnImgEdit').click();
  else if(st.lastAction==='extend') $('btnExtend').click();
};

window.dlVault = async (idx) => {
  const item = st.vault[idx]; if(!item) return;
  let url = item.url;
  if(item.type==='video' && st.muted){
    const silent = await muxOrStripVideo(item.url, null, false, true);
    url = URL.createObjectURL(silent);
  }
  const a=document.createElement('a'); a.href=url; a.download='studio-yaniv-'+(item.type==='video'?'video.webm':'image.png'); a.click();
};
$('btnDlNow').onclick = () => { if(st.vault.length) window.dlVault(0); };
</script>
